<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Neon Globe Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One screen: the globe fills it; live numbers pinned top left, switches pinned along the bottom. The maze's blue on black. */
:root {
  --bg: #07070d;      /* the maze's floor */
  --ink: #dfe6ff;     /* the neon's pale core */
  --soft: #8f9cc9;
  --blue: #2c55ff;    /* the maze's walls */
  --panel: rgba(7, 7, 13, 0.78);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--mono); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
#hud { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px));
  right: max(8px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; pointer-events: none; }
#live { cursor: pointer; }
#live, #result { margin: 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--blue); border-radius: 4px;
  font-size: 11px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; font-variant-numeric: tabular-nums;
  pointer-events: auto; user-select: text; -webkit-user-select: text; }
#result { color: #fff; }
#result:empty { display: none; }
#controls { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 6px;
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
button { font: 600 13px var(--mono); color: var(--ink); background: var(--panel); border: 1.5px solid var(--blue); border-radius: 4px;
  min-height: 44px; padding: 0 12px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#measure { border-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
#hud[hidden], .row[hidden] { display: none; }
</style>
<div id="stage"></div>
<div id="hud"><pre id="live">starting...</pre><pre id="result"></pre></div>
<div id="controls">
  <div id="switches" class="row" hidden>
    <button id="scale" type="button"></button>
    <button id="map" type="button"></button>
    <button id="globe" type="button"></button>
    <button id="lights" type="button"></button>
    <button id="speed" type="button"></button>
  </div>
  <div class="row">
    <button id="measure" type="button">Measure</button>
    <button id="copy" type="button">Copy</button>
    <button id="hide" type="button">Hide</button>
    <button id="more" type="button">More</button>
  </div>
</div>
