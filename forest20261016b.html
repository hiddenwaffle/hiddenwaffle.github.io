// ---------------------------------------------------------------------------------------------
// src/render/palette.ts (only what this slice uses)

const PAPER = 0xe9e2cf;
const INK = 0x1b1a1f;
const GRASS = 0x7fbf4d;
const GRASS_DARK = 0x5f9a38;
const WATER = 0x4aa3df;
const SAND = 0xd9b77a;

// ---------------------------------------------------------------------------------------------
// src/render/halftone.ts

const fragment = /* glsl */ `
in vec2 vTextureCoord;
out vec4 finalColor;

uniform sampler2D uTexture;
uniform highp vec4 uInputSize;

// uInputSize is in CSS pixels, so the dot size and shift are too. uRes is
// device pixels per CSS pixel, used to keep edges about one device pixel soft.
uniform float uDot;
uniform float uRes;
uniform vec3 uPaper;
uniform float uStrength;
uniform vec2 uShift;
uniform float uGrain;

// Colour without premultiplied alpha. Fully transparent pixels read as bare paper,
// so they print no ink.
vec3 sampleRGB(vec2 uv) {
  vec4 c = texture(uTexture, uv);
  return c.a > 0.001 ? c.rgb / c.a : uPaper;
}

vec4 toCMYK(vec3 rgb) {
  float k = 1.0 - max(max(rgb.r, rgb.g), rgb.b);
  float inv = 1.0 - k;
  vec3 cmy = inv > 0.0001 ? (vec3(1.0) - rgb - vec3(k)) / inv : vec3(0.0);
  return vec4(cmy, k);
}

float screenDot(vec2 px, float angle, float value) {
  float s = sin(angle);
  float c = cos(angle);
  vec2 p = mat2(c, s, -s, c) * px / uDot;
  vec2 cell = fract(p) - 0.5;
  float d = length(cell);
  // A dot of radius 0.564 * sqrt(v) covers v of its cell; a little more reads punchier.
  float r = sqrt(clamp(value, 0.0, 1.0)) * 0.6;
  float aa = 0.8 / (uDot * uRes);
  return 1.0 - smoothstep(r - aa, r + aa, d);
}

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  float alpha = texture(uTexture, vTextureCoord).a;
  if (alpha <= 0.001) {
    finalColor = vec4(0.0);
    return;
  }
  vec2 px = vTextureCoord * uInputSize.xy;
  vec2 texel = uInputSize.zw;
  vec3 base = sampleRGB(vTextureCoord);
  vec4 plateC = toCMYK(sampleRGB(vTextureCoord + uShift * texel));
  vec4 plateM = toCMYK(sampleRGB(vTextureCoord - uShift * texel));
  vec4 plate = toCMYK(base);

  float cyan = screenDot(px, 0.2618, plateC.x);
  float magenta = screenDot(px, 1.3090, plateM.y);
  float yellow = screenDot(px, 0.0, plate.z);
  // Black prints solid for dark lines and only screens in darker tones, so
  // bright flat colours stay clean.
  float kv = plate.w;
  float black = max(smoothstep(0.62, 0.78, kv), screenDot(px, 0.7854, smoothstep(0.3, 1.0, kv) * 0.8));

  vec3 col = uPaper;
  col *= mix(vec3(1.0), vec3(0.0, 0.62, 0.88), cyan);
  col *= mix(vec3(1.0), vec3(0.93, 0.12, 0.52), magenta);
  col *= mix(vec3(1.0), vec3(1.0, 0.93, 0.08), yellow);
  col *= mix(vec3(1.0), vec3(0.11, 0.10, 0.12), black);
  col += (hash(floor(px * uRes)) - 0.5) * uGrain;

  finalColor = vec4(mix(base, col, uStrength) * alpha, alpha);
}
`;

const PRINT = { strength: 0.15, dotScale: 0.55, grain: 0, shift: 0.1 };

function rgb(n) {
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

class HalftoneFilter extends Filter {
  constructor(opts) {
    const glProgram = GlProgram.from({ vertex: defaultFilterVert, fragment, name: 'halftone-filter' });
    super({
      glProgram,
      resources: {
        halftoneUniforms: new UniformGroup({
          uDot: { value: opts.dot * PRINT.dotScale, type: 'f32' },
          uRes: { value: opts.resolution, type: 'f32' },
          uPaper: { value: new Float32Array(rgb(opts.paper)), type: 'vec3<f32>' },
          uStrength: { value: opts.strength, type: 'f32' },
          uShift: { value: new Float32Array([0.6 * PRINT.shift, 0.35 * PRINT.shift]), type: 'vec2<f32>' },
          uGrain: { value: PRINT.grain, type: 'f32' },
        }),
      },
    });
    this.resolution = opts.resolution;
    this.deviceRes = opts.resolution;
  }

  get u() {
    return this.resources.halftoneUniforms.uniforms;
  }

  setDot(cssPx, resolution) {
    this.u.uDot = cssPx * PRINT.dotScale;
    this.u.uRes = resolution;
    this.resolution = resolution;
    this.deviceRes = resolution;
  }

  get strength() {
    return this.u.uStrength;
  }

  set strength(v) {
    this.u.uStrength = v;
  }
}

// src/engine/layout.ts

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const MAX_ASPECT = 16 / 9;
const MIN_ASPECT = 9 / 20;

function computeLayout(vw, vh, safe = { top: 0, right: 0, bottom: 0, left: 0 }, textSize = 1) {
  const short = Math.min(vw, vh);
  const orientation = vh > vw ? 'portrait' : 'landscape';
  const compact = short < 560;
  const margin = Math.round(clamp(short * 0.02, 5, 20));
  const unit = Math.round(clamp(short / 30, 13, 22) * textSize);

  const left = safe.left + margin;
  const right = vw - safe.right - margin;
  let top = safe.top + margin;
  const bottom = vh - safe.bottom - margin;

  let masthead = null;
  const mastheadH = compact ? (orientation === 'portrait' ? clamp(vh * 0.06, 30, 52) : 0) : clamp(vh * 0.085, 48, 104);
  if (mastheadH > 0) {
    masthead = { x: left, y: top, w: right - left, h: Math.round(mastheadH) };
    top += masthead.h + Math.round(margin * 0.6);
  }

  const area = { x: left, y: top, w: Math.max(1, right - left), h: Math.max(1, bottom - top) };
  let panel = { ...area };
  const columns = [];
  let footer = null;
  const aspect = area.w / area.h;

  if (aspect > MAX_ASPECT) {
    const w = Math.round(area.h * MAX_ASPECT);
    const spare = area.w - w;
    const gap = margin;
    const colW = Math.floor((spare - gap * 2) / 2);
    panel = { x: area.x + Math.floor(spare / 2), y: area.y, w, h: area.h };
    if (colW >= 90) {
      columns.push({ x: area.x, y: area.y, w: colW, h: area.h });
      columns.push({ x: panel.x + panel.w + gap, y: area.y, w: colW, h: area.h });
    }
  } else if (aspect < MIN_ASPECT) {
    const h = Math.round(area.w / MIN_ASPECT);
    panel = { x: area.x, y: area.y, w: area.w, h };
    footer = { x: area.x, y: area.y + h + margin, w: area.w, h: area.h - h - margin };
  }

  return { vw, vh, orientation, compact, margin, masthead, panel, columns, footer, unit };
}

function expandedPanel(l, safe) {
  const w = Math.max(1, l.vw - safe.left - safe.right), h = Math.max(1, l.vh - safe.top - safe.bottom);
  const scale = Math.min(w / l.panel.w, h / l.panel.h);
  const pw = l.panel.w * scale, ph = l.panel.h * scale;
  return { x: safe.left + (w - pw) / 2, y: safe.top + (h - ph) / 2, w: pw, h: ph };
}

function readSafeInsets() {
  const probe = document.createElement('div');
  probe.style.cssText =
    'position:fixed;visibility:hidden;pointer-events:none;' +
    'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
    'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const insets = {
    top: parseFloat(cs.paddingTop) || 0,
    right: parseFloat(cs.paddingRight) || 0,
    bottom: parseFloat(cs.paddingBottom) || 0,
    left: parseFloat(cs.paddingLeft) || 0,
  };
  probe.remove();
  return insets;
}

function viewportSize() {
  const vv = window.visualViewport;
  if (vv) return { w: Math.round(vv.width), h: Math.round(vv.height) };
  return { w: window.innerWidth, h: window.innerHeight };
}

function thumbReach(l) {
  return l.orientation === 'portrait' && l.compact;
}

// ---------------------------------------------------------------------------------------------
// src/engine/turn.ts (the upright lock)

const PHONE_SHORT_SIDE = 600;
const STALE_MS = 1000;

function quarter(a) {
  if (typeof a !== 'number' || !Number.isFinite(a)) return null;
  const q = ((Math.round(a) % 360) + 360) % 360;
  return q === 0 || q === 90 || q === 180 || q === 270 ? q : null;
}

function chooseTurn(o) {
  if (!o.phone) return 0;
  const landscape = o.vw > o.vh;
  const a = o.angle;
  if (landscape && (a === 90 || a === 270)) return a;
  if (!landscape && (a === 0 || a === 180)) return a;
  if (a !== null && !o.fresh) return 0;
  if (landscape) return o.last === 90 || o.last === 270 ? o.last : 90;
  return o.last === 180 ? 180 : 0;
}

function readingIsFresh(o) {
  if (o.now - o.turnedAt >= STALE_MS) return false;
  const at = o.sizeAtTurn;
  return at !== null && at[0] === o.size[0] && at[1] === o.size[1];
}

function uprightSize(t, cw, ch) {
  return t === 90 || t === 270 ? [ch, cw] : [cw, ch];
}

function rootPlacement(t, cw, ch) {
  if (t === 90) return { rotation: -Math.PI / 2, x: 0, y: ch };
  if (t === 270) return { rotation: Math.PI / 2, x: cw, y: 0 };
  if (t === 180) return { rotation: Math.PI, x: cw, y: ch };
  return { rotation: 0, x: 0, y: 0 };
}

function turnInsets(s, t) {
  if (t === 90) return { top: s.left, right: s.top, bottom: s.right, left: s.bottom };
  if (t === 270) return { top: s.right, right: s.bottom, bottom: s.left, left: s.top };
  if (t === 180) return { top: s.bottom, right: s.left, bottom: s.top, left: s.right };
  return { ...s };
}

function readScreen() {
  const coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  const short = Math.min(screen.width, screen.height);
  const legacy = window.orientation;
  const angle = quarter((screen.orientation && screen.orientation.angle) ?? legacy);
  return { phone: coarse && short > 0 && short < PHONE_SHORT_SIDE, angle };
}

// ---------------------------------------------------------------------------------------------
// src/engine/loop.ts

class FixedLoop {
  constructor(update, render) {
    this.step = 1 / 60;
    this.maxFrame = 0.25;
    this.timeScale = 1;
    this.paused = false;
    this.time = 0;
    this.acc = 0;
    this.update = update;
    this.render = render;
  }

  tick(realDt) {
    if (!this.paused) {
      this.acc += Math.min(realDt, this.maxFrame) * this.timeScale;
      let steps = 0;
      while (this.acc >= this.step && steps < 60) {
        this.update(this.step);
        this.time += this.step;
        this.acc -= this.step;
        steps++;
      }
    }
    this.render();
  }
}

function buildMap() {
  if (BORDER_GROUND.length !== BORDER_W * BORDER_H) throw new Error('The border ground data has the wrong length: ' + BORDER_GROUND.length);
  const terrain = new Uint8Array(BORDER_W * BORDER_H);
  BORDER_GROUND.forEach((gid, i) => { if (gid !== 0) terrain[i] = gid - 1; });
  const objects = BORDER_PROP_OBJECTS.map(([name, kind, x, y]) => ({ name, type: 'prop', x, y, w: 0, h: 0, point: true, props: { kind, solid: kind === 'palm' } }));
  return { id: 'border', width: BORDER_W, height: BORDER_H, props: BORDER_PROPS, terrain, objects };
}

// The look's parts that are on in the game (src/render/look.ts KEPT, no ?look= in the address).

const LOOK = new Set(['neon', 'edges', 'water', 'plants', 'blend', 'cabinet', 'city', 'square', 'wreck', 'rifle', 'pictures', 'portraits', 'heads', 'mouths']);
const PLANTS = { field: { wet: 'willow', dry: ['pine'] }, border: { wet: 'birch', dry: ['spruce', 'birch'] } };

// ---------------------------------------------------------------------------------------------
// src/ui/print.ts burstPoints (used by the water's glints)

function burstPoints(cx, cy, r, n, inner, turn = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const rr = i % 2 ? r * inner : r;
    const a = (i / (n * 2)) * Math.PI * 2 + turn - Math.PI / 2;
    pts.push(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  return pts;
}

// ---------------------------------------------------------------------------------------------
// src/world/terrainView.ts (the printed side, for the tile kinds of this slice)

const ROUNDED = ['grass', 'grass_dark', 'water', 'sand', 'path', 'rock'];
const ROUND = 11;

function mergeSegments(segs) {
  const byKey = new Map();
  for (const s of segs) {
    const horiz = s[1] === s[3];
    const k = horiz ? `h${s[1]},${s[5]}` : `v${s[0]},${s[4]}`;
    (byKey.get(k) ?? byKey.set(k, []).get(k)).push(s);
  }
  const out = [];
  for (const [k, list] of byKey) {
    const horiz = k.startsWith('h');
    list.sort((a, b) => (horiz ? a[0] - b[0] : a[1] - b[1]));
    let cur = [...list[0]];
    for (let i = 1; i < list.length; i++) {
      const s = list[i];
      const touches = horiz ? s[0] === cur[2] : s[1] === cur[3];
      if (touches) {
        cur[2] = s[2];
        cur[3] = s[3];
      } else {
        out.push(cur);
        cur = [...s];
      }
    }
    out.push(cur);
  }
  return out;
}

class TerrainView {
  constructor(map) {
    this.map = map;
    this.arcade = new Container();
    this.print = new Container();
    this.ripples = new Graphics();
    this.water = [];
    this.tick = 0;
    this.ripplesAt = 0;
    this.rippleTiles = 0;
    this.beyond = new Graphics();
    this.past = false;
    const p = new Graphics();
    this.beyond.visible = false;
    this.print.addChild(this.beyond, p, ...(LOOK.has('water') ? [this.ripples] : []));
    this.drawPrint(p);
    this.update(0);
  }

  update(t, view) {
    if (!LOOK.has('neon') && !LOOK.has('water')) return;
    if (this.tick++ % 3 && t > 0) return;
    const at = motion.reduced ? 0 : t;
    if (LOOK.has('water')) this.drawRipples(at, view);
  }

  drawRipples(t, view) {
    const g = this.ripples;
    this.ripplesAt = t;
    g.clear();
    const levels = [[], [], [], []];
    const glints = [];
    const tiles = this.water;
    let drawn = 0;
    for (const [x, y] of tiles) {
      const X = x * TILE;
      const Y = y * TILE;
      if (view && (X + TILE < view[0] || Y + TILE < view[1] || X > view[2] || Y > view[3])) continue;
      drawn++;
      for (let k = 0; k < 2; k++) {
        if (this.rnd(x, y, 1 + k * 7) > 0.5) continue;
        const ph = this.rnd(x, y, 2 + k * 7) * Math.PI * 2;
        const strength = 0.5 + 0.5 * Math.sin(t * 1.1 + ph);
        const level = Math.min(3, Math.floor(strength * 4));
        if (strength < 0.12) continue;
        const wx = X + 6 + Math.sin(t * 0.8 + ph) * 4;
        const wy = Y + 7 + this.rnd(x, y, 3 + k * 7) * 18 + Math.sin(t * 1.3 + ph) * 1.2;
        levels[level].push([wx, wy]);
      }
      const gp = (t * 0.7 + this.rnd(x, y, 5) * 12) % 12;
      if (gp < 0.6) glints.push(X + 6 + this.rnd(x, y, 6) * 20, Y + 6 + this.rnd(x, y, 8) * 20, Math.sin((gp / 0.6) * Math.PI));
    }
    levels.forEach((list, i) => {
      if (!list.length) return;
      for (const [wx, wy] of list) g.moveTo(wx, wy).quadraticCurveTo(wx + 5, wy - 3, wx + 10, wy).quadraticCurveTo(wx + 15, wy + 3, wx + 20, wy);
      g.stroke({ width: 1.3, color: 0xdff3ff, alpha: (i + 1) / 4 });
    });
    for (let i = 0; i < glints.length; i += 3) g.poly(burstPoints(glints[i], glints[i + 1], 1 + glints[i + 2] * 3, 4, 0.3, 0)).fill(0xffffff);
    this.rippleTiles = drawn;
  }

  tid(x, y) {
    const m = this.map;
    const cx = Math.max(0, Math.min(m.width - 1, x));
    const cy = Math.max(0, Math.min(m.height - 1, y));
    if (cx === x && cy === y) return TERRAINS[m.terrain[y * m.width + x]].id;
    if (!this.past) return 'void';
    const t = TERRAINS[m.terrain[cy * m.width + cx]];
    return t.world === 'arcade' ? 'void' : t.id;
  }

  onMap(x, y) {
    return x >= 0 && y >= 0 && x < this.map.width && y < this.map.height;
  }

  isArcade(x, y) {
    const id = this.tid(x, y);
    return TERRAINS.find((t) => t.id === id).world === 'arcade';
  }

  edges(inside, outside, beyond = 0) {
    const m = this.map;
    const segs = [];
    for (let y = -beyond; y < m.height + beyond; y++) {
      for (let x = -beyond; x < m.width + beyond; x++) {
        if (!inside(x, y)) continue;
        const X = x * TILE;
        const Y = y * TILE;
        if (outside(x, y - 1)) segs.push([X, Y, X + TILE, Y, 0, -1]);
        if (outside(x, y + 1)) segs.push([X, Y + TILE, X + TILE, Y + TILE, 0, 1]);
        if (outside(x - 1, y)) segs.push([X, Y, X, Y + TILE, -1, 0]);
        if (outside(x + 1, y)) segs.push([X + TILE, Y, X + TILE, Y + TILE, 1, 0]);
      }
    }
    return mergeSegments(segs);
  }

  plainColor(id) {
    switch (id) {
      case 'grass':
      case 'rock':
        return GRASS;
      case 'grass_dark':
        return GRASS_DARK;
      case 'water':
        return WATER;
      case 'sand':
        return SAND;
      case 'path':
        return PATH;
      case 'bridge':
        return WOOD;
      case 'pavement':
        return PAVEMENT;
      case 'concrete_wall':
        return WALL_FACE;
      default:
        return TERRAINS.find((t) => t.id === id).color;
    }
  }

  rnd(x, y, k) {
    const s = Math.sin(x * 127.1 + y * 311.7 + k * 74.7) * 43758.5453;
    return s - Math.floor(s);
  }

  drawTile(g, x, y) {
    const id = this.tid(x, y);
    const X = x * TILE;
    const Y = y * TILE;
    const rnd = (a, b, k) => this.rnd(a, b, k);
    switch (id) {
      case 'grass':
      case 'grass_dark': {
        this.fillTile(g, x, y, id === 'grass' ? GRASS : GRASS_DARK);
        let tufts = 0;
        for (let k = 0; k < 3; k++) {
          const tx = X + 4 + rnd(x, y, k) * 24;
          const ty = Y + 6 + rnd(x, y, k + 9) * 22;
          if (rnd(x, y, k + 3) < 0.55) {
            g.moveTo(tx - 2, ty).lineTo(tx - 3, ty - 4).moveTo(tx, ty).lineTo(tx, ty - 5).moveTo(tx + 2, ty).lineTo(tx + 3, ty - 4);
            tufts++;
          }
        }
        if (tufts) g.stroke({ width: 1, color: id === 'grass' ? GRASS_DARK : 0x3f7a26 });
        break;
      }
      case 'water':
        this.fillTile(g, x, y, WATER);
        // The moving water draws its own ripples, which move.
        if (LOOK.has('water')) this.water.push([x, y]);
        else if (rnd(x, y, 1) < 0.45) {
          const wy = Y + 8 + rnd(x, y, 2) * 16;
          g.moveTo(X + 6, wy).quadraticCurveTo(X + 11, wy - 3, X + 16, wy).quadraticCurveTo(X + 21, wy + 3, X + 26, wy).stroke({ width: 1.3, color: 0xdff3ff });
        }
        break;
      case 'sand':
        this.fillTile(g, x, y, SAND);
        break;
      case 'path':
        this.fillTile(g, x, y, PATH);
        for (let k = 0; k < 2; k++) g.circle(X + 5 + rnd(x, y, k) * 22, Y + 5 + rnd(x, y, k + 4) * 22, 1.2).fill(0x8a6a3a);
        break;
      case 'bridge':
        g.rect(X, Y, TILE, TILE).fill(WOOD);
        for (let k = 0; k < 4; k++) g.moveTo(X + k * 8, Y).lineTo(X + k * 8, Y + TILE).stroke({ width: 1, color: INK });
        break;
      default:
        g.rect(X, Y, TILE, TILE).fill(TERRAINS.find((t) => t.id === id).color);
    }
  }

  roundedCorner(x, y, dx, dy) {
    const c = this.cornerGround(x, y, dx, dy);
    return c ? this.groundColor(c.id, c.x, c.y) : null;
  }

  cornerGround(x, y, dx, dy) {
    if (!LOOK.has('edges')) return null;
    const a = this.tid(x, y);
    const around = [this.tid(x + dx, y), this.tid(x, y + dy), this.tid(x + dx, y + dy)];
    if (!ROUNDED.includes(a) || around.some((t) => t === a || !ROUNDED.includes(t))) return null;
    const [n1, n2, d] = around;
    if (n1 === n2 || n1 === d) return { id: n1, x: x + dx, y };
    if (n2 === d) return { id: n2, x, y: y + dy };
    return { id: d, x: x + dx, y: y + dy };
  }

  groundColor(id, x, y) {
    return this.plainColor(id);
  }

  fillTile(g, x, y, color) {
    const X = x * TILE;
    const Y = y * TILE;
    const under = TerrainView.CORNERS.map(([dx, dy]) => this.roundedCorner(x, y, dx, dy));
    if (under.every((u) => u === null)) {
      g.rect(X, Y, TILE, TILE).fill(color);
      return;
    }
    const pts = [];
    TerrainView.CORNERS.forEach(([dx, dy], i) => {
      const [cx, cy] = [dx < 0 ? X : X + TILE, dy < 0 ? Y : Y + TILE];
      const u = under[i];
      if (u === null || u === undefined) {
        pts.push(cx, cy);
        return;
      }
      g.rect(dx < 0 ? X : X + TILE - ROUND, dy < 0 ? Y : Y + TILE - ROUND, ROUND, ROUND).fill(u);
      const [ox, oy] = [cx - dx * ROUND, cy - dy * ROUND];
      for (let s = 0; s <= 6; s++) {
        const a = TerrainView.ARC_FROM[i] + (s / 6) * (Math.PI / 2);
        pts.push(ox + Math.cos(a) * ROUND, oy + Math.sin(a) * ROUND);
      }
    });
    g.poly(pts).fill(color);
  }

  // The shore ink, for the water tiles where `where` holds (the game passes all of them; here the slice).
  outline(g, id, where) {
    const m = this.map;
    const arcs = new Set();
    let any = false;
    for (let y = 0; y < m.height; y++) {
      for (let x = 0; x < m.width; x++) {
        if (!where(x, y) || this.tid(x, y) !== id) continue;
        for (const [sx, sy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
          const nid = this.tid(x + sx, y + sy);
          if (nid === id || nid === 'void') continue;
          const ends = (sx === 0 ? [[-1, sy], [1, sy]] : [[sx, -1], [sx, 1]]).map(([dx, dy]) => {
            const [ndx, ndy] = [sx === 0 ? dx : -dx, sy === 0 ? dy : -dy];
            const mine = this.cornerGround(x, y, dx, dy) !== null;
            const theirs = (this.cornerGround(x + sx, y + sy, ndx, ndy) || {}).id === id;
            if (mine) arcs.add(`${x},${y},${dx},${dy}`);
            if (theirs) arcs.add(`${x + sx},${y + sy},${ndx},${ndy}`);
            return { vx: (x + (dx > 0 ? 1 : 0)) * TILE, vy: (y + (dy > 0 ? 1 : 0)) * TILE, cut: mine || theirs ? ROUND : 0 };
          });
          const [a, b] = ends;
          const ux = Math.sign(b.vx - a.vx);
          const uy = Math.sign(b.vy - a.vy);
          g.moveTo(a.vx + ux * a.cut, a.vy + uy * a.cut).lineTo(b.vx - ux * b.cut, b.vy - uy * b.cut);
          any = true;
        }
      }
    }
    for (const key of arcs) {
      const [x, y, dx, dy] = key.split(',').map(Number);
      const i = TerrainView.CORNERS.findIndex(([cx, cy]) => cx === dx && cy === dy);
      const [ox, oy] = [(x + (dx > 0 ? 1 : 0)) * TILE - dx * ROUND, (y + (dy > 0 ? 1 : 0)) * TILE - dy * ROUND];
      const a0 = TerrainView.ARC_FROM[i];
      // Fixed 2026-10-16 as in the game: one Bezier per quarter circle, since arc() repeated the start point and the
      // zero-length step built vertices that are not numbers (spikes to the screen's middle on a Galaxy).
      const a1 = a0 + Math.PI / 2, k = 0.5522847498 * ROUND;
      const x0 = ox + Math.cos(a0) * ROUND, y0 = oy + Math.sin(a0) * ROUND, x3 = ox + Math.cos(a1) * ROUND, y3 = oy + Math.sin(a1) * ROUND;
      g.moveTo(x0, y0).bezierCurveTo(x0 - Math.sin(a0) * k, y0 + Math.cos(a0) * k, x3 + Math.sin(a1) * k, y3 - Math.cos(a1) * k, x3, y3);
      any = true;
    }
    if (any) g.stroke({ width: 2, color: INK, cap: 'round' });
  }

  // Where the printed world meets the arcade's floor, the grid runs on into the grass (only the slice's part is drawn).
  drawBlend(g) {
    const m = this.map;
    const near = new Map();
    let ring = [];
    for (let y = 0; y < m.height; y++) {
      for (let x = 0; x < m.width; x++) {
        if (this.isArcade(x, y)) continue;
        if ([[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dx, dy]) => this.tid(x + dx, y + dy) === 'arcade_floor')) {
          near.set(y * m.width + x, 1);
          ring.push([x, y]);
        }
      }
    }
    for (let d = 2; d <= 4; d++) {
      const next = [];
      for (const [x, y] of ring) {
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const [nx, ny] = [x + dx, y + dy];
          if (!this.onMap(nx, ny) || this.isArcade(nx, ny) || near.has(ny * m.width + nx)) continue;
          near.set(ny * m.width + nx, d);
          next.push([nx, ny]);
        }
      }
      ring = next;
    }
    const inks = [0x22b8e8, 0xf2267f, 0xffd23f];
    for (let d = 1; d <= 4; d++) {
      let any = false;
      for (const [k, dd] of near) {
        if (dd !== d) continue;
        const [x, y] = [k % m.width, Math.floor(k / m.width)];
        if (!inSlice(x, y)) continue;
        if (this.tid(x, y) === 'water') continue;
        const [X, Y] = [x * TILE, y * TILE];
        g.moveTo(X, Y).lineTo(X + TILE, Y).moveTo(X, Y).lineTo(X, Y + TILE);
        any = true;
      }
      if (any) g.stroke({ width: 1, color: 0x22b8e8, alpha: 0.55 * (1 - (d - 1) / 4) });
    }
    for (const [k, d] of near) {
      const [x, y] = [k % m.width, Math.floor(k / m.width)];
      if (!inSlice(x, y)) continue;
      if (this.tid(x, y) === 'water' || this.rnd(x, y, 90) > 0.55 - d * 0.12) continue;
      const [sx, sy] = [x * TILE + 4 + this.rnd(x, y, 91) * 24, y * TILE + 4 + this.rnd(x, y, 92) * 24];
      g.rect(sx - 1.5, sy - 1.5, 3, 3).fill(inks[Math.floor(this.rnd(x, y, 93) * 3)]);
    }
  }

  drawPrint(g) {
    for (let y = SLICE.y0; y <= SLICE.y1; y++) {
      for (let x = SLICE.x0; x <= SLICE.x1; x++) {
        if (!this.isArcade(x, y)) this.drawTile(g, x, y);
      }
    }
    if (LOOK.has('blend')) this.drawBlend(g);
    // Ink lines along shores.
    this.outline(g, 'water', inSlice);
    // The torn edge where the printed world meets the arcade.
    const tear = this.edges(
      (x, y) => inSlice(x, y) && !this.isArcade(x, y),
      (x, y) => this.isArcade(x, y) && this.tid(x, y) !== 'void',
    );
    if (tear.length) {
      for (const [x0, y0, x1, y1] of tear) g.moveTo(x0, y0).lineTo(x1, y1);
      g.stroke({ width: 3, color: PAPER, cap: 'square' });
      for (const [x0, y0, x1, y1, nx, ny] of tear) g.moveTo(x0 + nx * -2, y0 + ny * -2).lineTo(x1 + nx * -2, y1 + ny * -2);
      g.stroke({ width: 1.5, color: INK, cap: 'square' });
    }
  }
}
TerrainView.CORNERS = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
TerrainView.ARC_FROM = [Math.PI, Math.PI * 1.5, 0, Math.PI * 0.5];

// ---------------------------------------------------------------------------------------------
// src/art/props.ts (the entries this slice uses)

function flat(poly) {
  const out = [];
  for (const [x, y] of poly) out.push(x, y);
  return out;
}
const ink = (w = 1.4) => ({ width: w, color: INK, join: 'round' });

function flower(color) {
  return (g, t) => {
    const s = Math.sin(t * 2) * 0.6;
    g.moveTo(0, 0).lineTo(s, -7).stroke({ width: 1.2, color: 0x2e7d32 });
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      g.circle(s + Math.cos(a) * 2.6, -9 + Math.sin(a) * 2.6, 2.2).fill(color).stroke(ink(0.7));
    }
    g.circle(s, -9, 1.6).fill(0xffc400);
  };
}

function spruce(g) {
  g.rect(-2.5, -9, 5, 9).fill(0x6b4a2a).stroke(ink(1));
  for (let k = 0; k < 4; k++) {
    const y = -7 - k * 11;
    const hw = 15 - k * 3.3;
    g.poly(flat([[-hw, y], [-hw * 0.35, y - 6], [0, y - 20], [hw * 0.35, y - 6], [hw, y]])).fill(0x2e5e3a).stroke(ink(1.1));
  }
}

function birch(g, t) {
  const sway = Math.sin(t * 1.4) * 0.8;
  g.poly(flat([[-2.6, 0], [-1.8, -42], [1.8, -42], [2.6, 0]])).fill(0xf2efe6).stroke(ink(1.1));
  for (const [y, w] of [[-8, 2], [-15, 1.4], [-23, 2.2], [-31, 1.2], [-37, 1.8]]) g.moveTo(-1.8, y).lineTo(-1.8 + w, y - 0.6).stroke({ width: 1.3, color: INK });
  for (const [x, y, r] of [[-8, -42, 10], [7, -47, 11], [-1, -56, 9]]) g.circle(x + sway, y, r).fill(0xa3cc5e).stroke(ink(1.1));
}

const PROPS = {
  flower_white: { foot: [0, 0], height: 14, motion: 'sway', animate: true, draw: flower(0xffffff) },
  flower_yellow: { foot: [0, 0], height: 14, motion: 'sway', animate: true, draw: flower(0xffd23f) },
  spruce: { foot: [5, 6], height: 76, drawn: 60, draw: spruce },
  birch: { foot: [4, 6], height: 74, drawn: 65, motion: 'sway', animate: true, draw: birch },
};

// The real files' pixel sizes are not known to this page, so a hot pink box for a failed image is this size (a guess).
const ART_FALLBACK_SIZE = { width: 165, height: 320 };
const textures = new Map();
const failed = new Map();

async function loadOne(slot, url) {
  try {
    textures.set(slot, await Assets.load(url, { strategy: 'retry', retryCount: 2, retryDelay: 1000 }));
  } catch (e) {
    failed.set(slot, { ...ART_FALLBACK_SIZE });
    failedArt.push(slot);
    console.warn(`Art for ${slot} did not load; a hot pink box stands in for it.`, e);
  }
}

function pinkBox(width, height) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, width);
  c.height = Math.max(1, height);
  const g = c.getContext('2d');
  g.fillStyle = '#ff69b4';
  g.fillRect(0, 0, c.width, c.height);
  return Texture.from(c);
}

function art(slot) {
  const tex = textures.get(slot);
  if (tex) return tex;
  const f = failed.get(slot);
  if (!f) return null;
  f.box = f.box || pinkBox(f.width, f.height);
  return f.box;
}

// src/world/world.ts (the parts that draw, zoom and move the camera)

const TILES_SHORT = 10.5;
const PHONE_BODY_PX = 44;
const OLLI_SIZE = 11; // LOOKS.olli.size in src/art/characters.ts
const FULL_TILT = 0.2;

class World {
  constructor(game, map, halftone) {
    this.game = game;
    this.map = map;
    this.view = new Container();
    this.scene = new Container();
    this.arcadeSorted = new Container({ sortableChildren: true });
    this.printRoot = new Container();
    this.printSorted = new Container({ sortableChildren: true });
    this.fx = new Container();
    this.halftone = halftone;
    this.props = [];
    this.camX = 0;
    this.camY = 0;
    this.zoom = 1;
    this.baseZoom = 1;
    this.tilt = 0;
    this.viewW = 1;
    this.viewH = 1;
    this.propTick = 0;
    this.plantTurns = 0;
    // The point the camera looks at (the game's cameraTarget), here moved by dragging.
    this.target = { x: 15.5 * TILE, y: 13.5 * TILE };

    this.terrain = new TerrainView(map);
    const world = String(map.props.world ?? 'print');
    this.sorted = world === 'arcade' ? this.arcadeSorted : this.printSorted;
    this.printRoot.addChild(this.terrain.print, this.printSorted);
    this.scene.addChild(this.terrain.arcade, this.arcadeSorted, this.printRoot, this.fx);
    this.view.addChild(this.scene);
    if (world !== 'arcade') this.printRoot.filters = [halftone];
    this.buildObjects();
  }

  get world() {
    return String(this.map.props.world ?? 'print');
  }

  localPlant(o, kind) {
    const local = PLANTS[this.map.id];
    if (!LOOK.has('plants') || kind !== 'palm' || !local) return kind;
    const [tx, ty] = [Math.floor(o.x / TILE), Math.floor((o.y - 1) / TILE)];
    const water = TERRAINS.findIndex((t) => t.id === 'water');
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const [x, y] = [tx + dx, ty + dy];
        if (x >= 0 && y >= 0 && x < this.map.width && y < this.map.height && this.map.terrain[y * this.map.width + x] === water) return local.wet;
      }
    }
    return local.dry[this.plantTurns++ % local.dry.length];
  }

  buildObjects() {
    for (const o of this.map.objects) {
      if (o.type !== 'prop') continue;
      // Every palm takes its turn, as in the game, but only the ones inside the slice are put on the page.
      const kind = this.localPlant(o, String(o.props.kind));
      const [tx, ty] = [Math.floor(o.x / TILE), Math.floor((o.y - 1) / TILE)];
      if (!inSlice(tx, ty)) continue;
      const info = PROPS[kind];
      if (!info) continue;
      let view;
      const tex = art(`props/${kind}`);
      if (tex) {
        const sprite = new Sprite(tex);
        sprite.anchor.set(0.5, 1);
        const gfx = sprite;
        gfx.position.set(o.x, o.y);
        gfx.zIndex = o.y;
        this.sorted.addChild(gfx);
        view = { obj: o, gfx, kind, animated: false, base: info.height / tex.height, ...(info.motion ? { motion: info.motion } : {}) };
      } else {
        const drawing = new Graphics();
        info.draw(drawing, 0);
        const gfx = drawing;
        gfx.position.set(o.x, o.y);
        gfx.zIndex = o.y;
        this.sorted.addChild(gfx);
        view = { obj: o, gfx, drawing, kind, animated: Boolean(info.animate), ...(info.drawn ? { base: info.height / info.drawn } : {}) };
      }
      this.props.push(view);
    }
  }

  updateZoom() {
    this.zoom = this.baseZoom;
    this.halftone.setDot(Math.max(1.6, Math.min(4.2, this.zoom * 1.5)), this.halftone.deviceRes);
  }

  layout(panelW, panelH) {
    this.baseZoom = thumbReach(this.game.layout) ? PHONE_BODY_PX / (OLLI_SIZE * 2) : Math.min(panelW, panelH) / (TILES_SHORT * TILE);
    this.updateZoom();
    this.viewW = panelW;
    this.viewH = panelH;
    this.snapCamera();
  }

  get ground() {
    return 1 - FULL_TILT * this.tilt;
  }

  tiltAt(x) {
    const p = this.map.props;
    if (this.world === 'arcade') return 0;
    const t = p.tilt === undefined || String(p.tilt).trim() === '' ? NaN : Number(p.tilt);
    const full = Number.isFinite(t) ? Math.max(0, Math.min(1, t)) : 1;
    return full * this.easeAt(x);
  }

  easeAt(x) {
    const p = this.map.props;
    const ease = typeof p.tilt_ease_x === 'string' ? p.tilt_ease_x.split(',').map(Number) : null;
    if (!ease || ease.length !== 2 || ease.some((v) => !Number.isFinite(v))) return 1;
    const [a, b] = ease;
    const k = Math.max(0, Math.min(1, (x / TILE - a) / (b - a || 1)));
    return k * k * (3 - 2 * k);
  }

  // The look-at point stays east of the tilt's ease columns (x 9 to 14) and inside the slice.
  clampTarget() {
    this.target.x = Math.max(14 * TILE, Math.min((SLICE.x1 + 1) * TILE, this.target.x));
    this.target.y = Math.max(SLICE.y0 * TILE, Math.min((SLICE.y1 + 1) * TILE, this.target.y));
  }

  // The game clamps to the map's edges; here the slice's edges stand in for them.
  cameraGoal() {
    const t = this.target;
    let x = t.x;
    let y = t.y;
    const halfW = this.viewW / 2 / this.zoom;
    const halfH = this.viewH / 2 / (this.zoom * this.ground);
    const [x0, x1] = [SLICE.x0 * TILE, (SLICE.x1 + 1) * TILE];
    const [y0, y1] = [SLICE.y0 * TILE, (SLICE.y1 + 1) * TILE];
    const left = x0 + halfW;
    const right = x1 - halfW;
    x = left > right ? (left + right) / 2 : Math.max(left, Math.min(right, x));
    const lo = y0 + halfH;
    const hi = y1 - halfH;
    y = lo > hi ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, y));
    return [x, y];
  }

  snapCamera() {
    this.tilt = this.tiltAt(this.target.x);
    [this.camX, this.camY] = this.cameraGoal();
  }

  panBy(dxPanel, dyPanel) {
    this.target.x -= dxPanel / this.zoom;
    this.target.y -= dyPanel / (this.zoom * this.ground);
    this.clampTarget();
  }

  panelToWorld(px, py) {
    return [(px - this.viewW / 2) / this.zoom + this.camX, (py - this.viewH / 2) / (this.zoom * this.ground) + this.camY];
  }

  update(dt) {
    this.tilt = this.tiltAt(this.target.x);
    const [gx, gy] = this.cameraGoal();
    const k = 1 - Math.exp(-dt * 7);
    this.camX += (gx - this.camX) * k;
    this.camY += (gy - this.camY) * k;
  }

  render(t) {
    const upright = 1 / this.ground;
    const [vx0, vy0] = this.panelToWorld(0, 0);
    const [vx1, vy1] = this.panelToWorld(this.viewW, this.viewH);
    this.terrain.update(t, [vx0 - TILE, vy0 - TILE, vx1 + TILE, vy1 + TILE]);
    if (++this.propTick % 3 === 0) {
      for (const p of this.props) {
        if (!p.animated || !p.drawing) continue;
        p.drawing.clear();
        PROPS[p.kind].draw(p.drawing, t);
      }
    }
    for (const p of this.props) {
      const k = p.base ?? 1;
      const still = motion.reduced;
      const pulse = p.motion === 'pulse' && !still ? 1 + Math.sin(t * 3) * 0.08 : 1;
      if (p.motion === 'sway') p.gfx.skew.x = still ? 0 : Math.sin(t * 1.3 + p.obj.x * 0.05) * 0.04;
      const grow = p.grow ?? 1;
      p.gfx.scale.set((p.mirror ? -1 : 1) * k * pulse * grow, k * pulse * upright * grow);
    }
    this.scene.scale.set(this.zoom, this.zoom * this.ground);
    this.scene.position.set(this.viewW / 2 - this.camX * this.zoom, this.viewH / 2 - this.camY * this.zoom * this.ground);
    this.halftone.strength = this.game.settings.halftone ? PRINT.strength : 0;
  }
}

// ---------------------------------------------------------------------------------------------
// Boot, as src/main.ts and Game (the stage, the relayout, the viewport)

async function main() {
  const host = document.getElementById('game');
  const app = new Application();
  await app.init({
    antialias: true,
    autoDensity: true,
    resolution: Math.min(window.devicePixelRatio || 1, 3),
    background: PAPER,
    preference: 'webgl',
    width: host.clientWidth || window.innerWidth,
    height: host.clientHeight || window.innerHeight,
  });
  host.appendChild(app.canvas);
  app.canvas.addEventListener('webglcontextlost', () => {
    window.setTimeout(() => location.reload(), 1500);
  });

  await Promise.all(Object.entries(ART_URLS).map(([slot, url]) => loadOne(slot, url)));
  if (failedArt.length) noteFailedArt();

  const game = { layout: computeLayout(1, 1), settings: { halftone: true } };
  const halftone = new HalftoneFilter({ dot: 3.6, resolution: app.renderer.resolution, paper: PAPER, strength: PRINT.strength });
  const map = buildMap();
  const world = new World(game, map, halftone);

  const root = new Container();
  const viewport = new Container();
  const viewportMatte = new Graphics();
  const panel = new Container();
  const panelMask = new Graphics();
  const backdrop = new Graphics();
  const worldLayer = new Container();
  panel.addChild(backdrop, worldLayer);
  panel.mask = panelMask;
  viewport.addChild(panel, panelMask);
  root.addChild(viewportMatte, viewport);
  app.stage.addChild(root);
  worldLayer.addChild(world.view);

  let turn = 0;
  let turnedAt = -Infinity;
  let sizeAtTurn = null;
  let turnUnsure = false;
  let safeInsets = { top: 0, right: 0, bottom: 0, left: 0 };

  // Mirrors Game.placeViewport at full lift: the panel grows to the safe bounds, with the same aspect.
  function placeViewport() {
    const p = game.layout.panel, fit = expandedPanel(game.layout, safeInsets);
    const lift = 1;
    const amount = motion.reduced ? (lift >= 0.5 ? 1 : 0) : lift * lift * (3 - 2 * lift);
    const scale = 1 + (fit.w / p.w - 1) * amount;
    const x = p.x + (fit.x - p.x) * amount - p.x * scale;
    const y = p.y + (fit.y - p.y) * amount - p.y * scale;
    viewport.scale.set(scale);
    viewport.position.set(x, y);
  }

  function relayout() {
    const { w, h } = viewportSize();
    app.renderer.resize(w, h);
    const s = readScreen();
    const fresh = readingIsFresh({ now: performance.now(), turnedAt, size: [w, h], sizeAtTurn });
    turn = chooseTurn({ phone: s.phone, vw: w, vh: h, angle: s.angle, last: turn, fresh });
    const fits = w > h ? s.angle === 90 || s.angle === 270 : s.angle === 0 || s.angle === 180;
    turnUnsure = s.phone && !fits;
    const r = rootPlacement(turn, w, h);
    root.rotation = r.rotation;
    root.position.set(r.x, r.y);
    const [lw, lh] = uprightSize(turn, w, h);
    safeInsets = turnInsets(readSafeInsets(), turn);
    game.layout = computeLayout(lw, lh, safeInsets, 1);
    const p = game.layout.panel;
    panel.position.set(p.x, p.y);
    panelMask.clear().rect(p.x, p.y, p.w, p.h).fill(0xffffff);
    viewportMatte.clear().rect(0, 0, lw, lh).fill(0x000000);
    placeViewport();
    backdrop.clear().rect(0, 0, p.w, p.h).fill(PAPER);
    world.layout(p.w, p.h);
    updateReadout(true);
  }

  let pending = false;
  const schedule = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      relayout();
    });
  };
  window.addEventListener('resize', schedule);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
  const turned = () => {
    turnedAt = performance.now();
    const v = viewportSize();
    sizeAtTurn = [v.w, v.h];
    schedule();
    window.setTimeout(() => turnUnsure && schedule(), STALE_MS + 100);
  };
  window.addEventListener('orientationchange', turned);
  if (screen.orientation) screen.orientation.addEventListener('change', turned);

  // The loop: fixed steps for the camera, one render per frame.
  const loop = new FixedLoop((dt) => world.update(dt), () => world.render(loop.time));
  app.ticker.add((t) => loop.tick(t.deltaMS / 1000));

  // --- Controls (DOM, outside the filtered container) ---
  const printBtn = document.getElementById('printBtn');
  printBtn.addEventListener('click', () => {
    game.settings.halftone = !game.settings.halftone;
    printBtn.textContent = 'Print: ' + (game.settings.halftone ? 'on' : 'off');
  });

  // One-finger (or mouse) drag pans the camera's look-at point.
  let drag = null;
  const canvas = app.canvas;
  const panelPoint = (e) => {
    const r = canvas.getBoundingClientRect();
    const at = panel.toLocal({ x: e.clientX - r.left, y: e.clientY - r.top });
    return [at.x, at.y];
  };
  canvas.addEventListener('pointerdown', (e) => {
    if (drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { id: e.pointerId, last: panelPoint(e) };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* not every browser allows it */ }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = panelPoint(e);
    world.panBy(p[0] - drag.last[0], p[1] - drag.last[1]);
    drag.last = p;
  });
  const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // --- Readout ---
  let gpu = 'not given';
  try {
    const gl = app.renderer.gl;
    const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) gpu = String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
  } catch (_) { /* leave it as not given */ }
  const readout = document.getElementById('readout');
  let readoutOpen = true;
  readout.addEventListener('click', () => { readoutOpen = !readoutOpen; updateReadout(true); });
  let lastReadout = '';
  function updateReadout(force) {
    const l = game.layout;
    const vv = viewportSize();
    const lines = [
      readoutOpen ? 'tap to hide' : 'info (tap)',
    ];
    if (readoutOpen) {
      lines.push(
        'devicePixelRatio ' + (window.devicePixelRatio || 1),
        'renderer resolution ' + app.renderer.resolution,
        'CSS viewport ' + vv.w + ' x ' + vv.h,
        'orientation ' + l.orientation + ', compact ' + l.compact,
        'turn ' + turn + ', viewport scale ' + viewport.scale.x.toFixed(3),
        'zoom ' + world.zoom.toFixed(3),
        'uDot ' + halftone.u.uDot.toFixed(3) + ' CSS px (uRes ' + halftone.u.uRes + ')',
        'renderer ' + app.renderer.name,
        'GPU ' + gpu,
      );
    }
    const text = lines.join('\n');
    if (force || text !== lastReadout) {
      readout.textContent = text;
      lastReadout = text;
    }
  }
  setInterval(() => updateReadout(false), 500);

  relayout();
}

main().catch((err) => {
  console.error(err);
  fail('The page could not start.\n\n' + String((err && err.stack) || err));
});
})();
</script>
</body>
</html>
