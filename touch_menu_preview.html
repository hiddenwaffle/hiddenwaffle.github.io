html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font: 13px/1.2 Oswald, system-ui, sans-serif; color: #f6f1e3; }
#bar { position: absolute; left: 0; right: 0; top: 0; height: 34px; padding: 0 6px; padding-top: env(safe-area-inset-top); display: flex; align-items: center; gap: 6px; background: #000; }
#bar .seg { display: flex; border: 1.5px solid #57534b; border-radius: 7px; overflow: hidden; }
#bar button { appearance: none; border: 0; margin: 0; padding: 0 10px; height: 26px; font: 600 13px Oswald, system-ui, sans-serif; letter-spacing: 0.3px; color: #e9e2cf; background: #1b1a1f; touch-action: manipulation; }
#bar button.on { background: #ffd23f; color: #1b1a1f; }
#bar .gap { flex: 1; }
#bar #reset { border: 1.5px solid #57534b; border-radius: 7px; height: 26px; }
#stage { position: absolute; left: 0; top: 34px; display: block; }
#toast { position: absolute; left: 50%; top: 42px; transform: translateX(-50%); max-width: 92vw; padding: 5px 11px; border-radius: 6px; background: rgba(27, 26, 31, 0.92); border: 1px solid #57534b; color: #f6f1e3; font: 400 13px Oswald, system-ui, sans-serif; letter-spacing: 0.3px; white-space: nowrap; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
#toast.show { opacity: 1; transition: none; }
</style>
</head>
<body>
<div id="bar">
  <div class="seg"><button id="sPopup" class="on">Pop-up</button><button id="sFight">Fight</button></div>
  <div class="gap"></div>
  <div class="seg"><button id="mToday">Today</button><button id="mProposed" class="on">Proposed</button></div>
  <button id="reset" aria-label="Start again">&#x21BA;</button>
</div>
<svg id="stage" viewBox="0 0 402 681" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aimFrame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2267f"/><stop offset="0.55" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <linearGradient id="aimFrameBack" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#f2267f"/><stop offset="0.55" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <linearGradient id="foeMark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff7a1f"/></linearGradient>
    <clipPath id="stageClip"><rect x="0" y="0" width="402" height="681"/></clipPath>
  </defs>
  <g id="root" clip-path="url(#stageClip)"></g>
</svg>
<div id="toast"></div>
<script>
'use strict';
// A stand-in for the game's two menus on a phone, to try two ways a finger could work them. The shapes and
// sizes are the game's at an iPhone's Safari size (402 by 681), scaled to the screen; the words are stand-ins.
//   Today: a finger drags the cursor from row to row and it stays where it was let go; a row is chosen only
//   when let go on the row it pressed.
//   Proposed: the band and glove rest on the remembered row. A finger shows the band on the row it pressed;
//   off that row the band goes back to the remembered row, and letting go there does nothing.
const NS = 'http://www.w3.org/2000/svg';
const INK = '#1b1a1f', INK_SOFT = '#57534b', INK_FAINT = '#9a9383', PAPER = '#e9e2cf', PAPER_DARK = '#d8cfb6', BOX = '#f6f1e3';
const CAPTION = '#ffe98a', YELLOW = '#ffd23f', PINK = '#f2267f', CYAN = '#22b8e8', WHITE = '#ffffff', GAUGE_YELLOW = '#e8c13f';
const OSWALD = 'Oswald', BANGERS = 'Bangers', OLDSTD = 'Old Standard TT';
const LEAN = 0.21;

const stage = document.getElementById('stage');
const root = document.getElementById('root');
const toastEl = document.getElementById('toast');

// ---------------------------------------------------------------- drawing helpers
function el(parent, tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, s, attrs) {
  const t = el(parent, 'text', attrs);
  t.textContent = s;
  return t;
}
const width = (t) => t.getComputedTextLength();
const pop = (k) => { const s = 3.4, t = k - 1; return 1 + (s + 1) * t ** 3 + s * t ** 2; };
const onBeat = (t) => { const k = (t % 0.5) / 0.5; return (1 - k) ** 3; };
const poly = (pts) => pts.map((v) => Math.round(v * 100) / 100).join(' ');

// The cursor's pointing hand, s pixels long, its fingertip at (s, 0.16 s).
function glove(parent, s, line) {
  const g = el(parent, 'g');
  const parts = (d, fill, stroke) => {
    const at = (v) => v * s + d * s;
    const st = stroke ? { stroke: INK, 'stroke-width': line, 'stroke-linejoin': 'round' } : {};
    const rr = (x, y, w, h, r) => el(g, 'rect', { x: at(x), y: at(y), width: w * s, height: h * s, rx: r * s, fill, ...st });
    rr(0.48, 0.08, 0.52, 0.16, 0.08);
    rr(0.13, 0.07, 0.5, 0.44, 0.15);
    for (const [x, y] of [[0.5, 0.23], [0.49, 0.32], [0.46, 0.41]]) rr(x, y, 0.17, 0.1, 0.05);
    rr(0.3, 0.19, 0.24, 0.1, 0.05);
    el(g, 'polygon', { points: poly([at(0), at(0.03), at(0.16), at(0.09), at(0.16), at(0.49), at(0), at(0.55)]), fill, ...st });
  };
  parts(0.045, INK, false);
  parts(0, WHITE, true);
  return g;
}

// Halftone dots growing from `from` to `to`, as one path.
function benDay(box, pitch, from, to, inside) {
  let d = '';
  const rMax = pitch * 0.42;
  const [fx, fy] = from;
  const dx = to[0] - fx, dy = to[1] - fy;
  const len2 = Math.max(1, dx * dx + dy * dy);
  const shift = -pitch;
  for (let r = 0, y = box.y + pitch * 0.25; y < box.y + box.h; r++, y += pitch * 0.5) {
    for (let x = box.x + (r % 2 ? pitch * 0.5 : 0) + pitch * 0.25 + shift; x < box.x + box.w; x += pitch) {
      const k = Math.max(0, Math.min(1, ((x - fx) * dx + (y - fy) * dy) / len2));
      const rad = Math.min(rMax * k, x - box.x, box.x + box.w - x, y - box.y, box.y + box.h - y);
      if (rad < 0.6) continue;
      if (inside && !inside(x, y)) continue;
      d += `M${(x - rad).toFixed(2)},${y.toFixed(2)}a${rad.toFixed(2)},${rad.toFixed(2)} 0 1,0 ${(2 * rad).toFixed(2)},0a${rad.toFixed(2)},${rad.toFixed(2)} 0 1,0 ${(-2 * rad).toFixed(2)},0`;
    }
  }
  return d;
}

function seeded(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// A few loose poster shapes along a strip, as the game throws beside a page's title.
function confetti(g, area, u, seed) {
  if (area.w < u * 1.5) return;
  const rnd = seeded(seed + 7);
  const line = Math.max(1.5, u * 0.08 * 1.1);
  const inks = [PINK, CYAN, YELLOW];
  const n = Math.max(2, Math.min(4, Math.floor(area.w / (u * 2.2))));
  for (let i = 0; i < n; i++) {
    const cx = area.x + ((i + 0.5) / n) * area.w + (rnd() - 0.5) * u * 0.6;
    const cy = area.y + area.h * (0.25 + rnd() * 0.5);
    const s = u * (0.7 + rnd() * 0.3);
    const a = rnd() * Math.PI;
    const ink = inks[(i + seed) % inks.length];
    const kind = (i + seed) % 4;
    const rot = (px, py) => [cx + px * Math.cos(a) - py * Math.sin(a), cy + px * Math.sin(a) + py * Math.cos(a)];
    const pts = (arr) => arr.flatMap((v, j) => (j % 2 ? [] : rot(v * s, arr[j + 1] * s)));
    if (kind === 0) {
      const p = pts([-1, 0.3, -0.5, -0.3, 0, 0.3, 0.5, -0.3, 1, 0.3]);
      el(g, 'polyline', { points: poly(p), fill: 'none', stroke: INK, 'stroke-width': line * 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      el(g, 'polyline', { points: poly(p), fill: 'none', stroke: ink, 'stroke-width': line * 1.1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    } else if (kind === 1) {
      el(g, 'polygon', { points: poly(pts([0, -0.7, 0.65, 0.45, -0.65, 0.45])), fill: ink, stroke: INK, 'stroke-width': line, 'stroke-linejoin': 'round' });
    } else if (kind === 2) {
      el(g, 'circle', { cx, cy, r: s * 0.5, fill: 'none', stroke: INK, 'stroke-width': line * 2.6 });
      el(g, 'circle', { cx, cy, r: s * 0.5, fill: 'none', stroke: ink, 'stroke-width': line * 1.2 });
    } else {
      el(g, 'polygon', { points: poly(pts([0.15, -0.8, -0.35, 0.1, 0.05, 0.1, -0.15, 0.8, 0.4, -0.15, 0, -0.15])), fill: ink, stroke: INK, 'stroke-width': line, 'stroke-linejoin': 'round' });
    }
  }
}

// A lettering tab: a plate with its right end cut at an angle. ink: 'ink' (yellow capitals), 'pink' (white outlined), 'cyan'.
function tab(parent, str, { x, y, size, h, u, ink = 'ink', keyline = false, rotate = 0 }) {
  const g = el(parent, 'g', { transform: `translate(${x} ${y}) rotate(${(rotate * 180) / Math.PI})` });
  const plate = el(g, 'g');
  const outline = Math.max(2, Math.round(size * 0.13));
  const letterFill = ink === 'pink' ? WHITE : ink === 'cyan' ? INK : YELLOW;
  const spacing = Math.round(size * 0.05 * 10) / 10;
  const t = text(g, str.toUpperCase(), {
    x: Math.round(u * 0.3), y: h / 2 + size * 0.04 + size * 0.36, 'font-family': BANGERS, 'font-size': size, 'letter-spacing': spacing, fill: letterFill,
    ...(ink === 'pink' ? { stroke: INK, 'stroke-width': outline, 'stroke-linejoin': 'round', 'paint-order': 'stroke' } : {}),
  });
  const w = Math.round(width(t) + outline + u * 0.6 + h * LEAN);
  const pts = poly([0, 0, w, 0, w - h * LEAN, h, 0, h]);
  if (keyline) el(plate, 'polygon', { points: pts, fill: 'none', stroke: PAPER, 'stroke-width': 4, 'stroke-linejoin': 'miter' });
  el(plate, 'polygon', { points: pts, fill: ink === 'pink' ? PINK : ink === 'cyan' ? CYAN : INK });
  if (ink === 'pink') el(plate, 'polygon', { points: pts, fill: 'none', stroke: INK, 'stroke-width': Math.max(1.5, u * 0.08) });
  return { g, w, h };
}

// Lettering with an ink outline and a solid ink extrude, as the fight's lit words are.
function posterWords(parent, s, attrs, { outline, extrude }) {
  const g = el(parent, 'g');
  if (extrude) text(g, s, { ...attrs, x: attrs.x + extrude, y: attrs.y + extrude, fill: INK, stroke: INK, 'stroke-width': outline, 'stroke-linejoin': 'round' });
  const t = text(g, s, { ...attrs, stroke: INK, 'stroke-width': outline, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
  return { g, t };
}

// The fight's row icons: a burst, a star, a bottle.
function rowIcon(parent, kind, x, y, s, line, color) {
  const g = el(parent, 'g', { transform: `translate(${x} ${y})` });
  const c = s / 2;
  const st = { fill: 'none', stroke: color, 'stroke-width': line, 'stroke-linejoin': 'round' };
  if (kind === 'burst' || kind === 'star') {
    const n = kind === 'burst' ? 16 : 10, lo = kind === 'burst' ? 0.26 : 0.2;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const r = (i % 2 ? lo : 0.48) * s;
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      pts.push(c + Math.cos(a) * r, c + Math.sin(a) * r);
    }
    el(g, 'polygon', { points: poly(pts), ...st });
  } else {
    const w = s * 0.5, x0 = c - w / 2;
    el(g, 'rect', { x: c - s * 0.09, y: s * 0.06, width: s * 0.18, height: s * 0.14, ...st });
    el(g, 'polyline', { points: poly([c - s * 0.09, s * 0.2, c - s * 0.09, s * 0.32, x0, s * 0.44, x0, s * 0.92, x0 + w, s * 0.92, x0 + w, s * 0.44, c + s * 0.09, s * 0.32, c + s * 0.09, s * 0.2]), ...st });
  }
  return g;
}

// A stand-in face for a portrait or a figure: a ball of colour with the party's big eyes, looking right.
function face(parent, cx, cy, r, colors, opts = {}) {
  const g = el(parent, 'g');
  const [a, b] = colors;
  el(g, 'circle', { cx, cy, r, fill: a, stroke: INK, 'stroke-width': opts.line ?? 1.6 });
  if (b) el(g, 'path', { d: `M${cx - r},${cy + r * 0.15} A${r},${r} 0 0,0 ${cx + r},${cy + r * 0.15} Z`, fill: b });
  if (b) el(g, 'circle', { cx, cy, r, fill: 'none', stroke: INK, 'stroke-width': opts.line ?? 1.6 });
  for (const [ex, ey] of [[0.12, -0.12], [0.5, -0.06]]) {
    el(g, 'circle', { cx: cx + ex * r, cy: cy + ey * r, r: r * 0.26, fill: WHITE, stroke: INK, 'stroke-width': Math.max(1, r * 0.07) });
    el(g, 'circle', { cx: cx + ex * r + r * 0.09, cy: cy + ey * r + r * 0.03, r: r * 0.11, fill: INK });
  }
  return g;
}

// ---------------------------------------------------------------- state
const MEMBERS = [
  { name: 'Mira', colors: ['#2c7be5', '#f6f1e3'] },
  { name: 'Dexter', colors: ['#e0583c', '#f4c95d'] },
  { name: 'Hubert', colors: ['#5fa86b', '#f6f1e3'] },
];
let mode = 'proposed';
let screen = 'popup';
let P, F;
function resetPopup() {
  P = {
    party: [{ gu: 150, guMax: 150, sp: 6, spMax: 10 }, { gu: 56, guMax: 140, sp: 6, spMax: 10 }, { gu: 180, guMax: 180, sp: 21, spMax: 35 }],

    buttons: 50, loud: 8, clatter: 10,

    stack: [{ page: 'main', index: 0 }],
  };
}
function resetFight() {
  F = {
    team: [{ gu: 150, guMax: 150, sp: 10, spMax: 10 }, { gu: 140, guMax: 140, sp: 10, spMax: 10 }, { gu: 120, guMax: 180, sp: 35, spMax: 35 }],
    foes: [{ name: 'The Paper Clerk A', x: 237, y: 331, hitAt: -1 }, { name: 'The Paper Clerk B', x: 137, y: 311, hitAt: -1 }],
    pockets: { biscuit: 10, soda: 2, feather: 1 },
    turn: 0,
    stack: [{ page: 'command', index: 0 }],
  };
}
resetPopup();
resetFight();

const stack = () => (screen === 'popup' ? P.stack : F.stack);
const topEntry = () => stack().at(-1);
// A finger on a list: the pointer, the zone it pressed, its row, and whether it is still on that row.
let press = null;

function shownRow() {
  const e = topEntry();
  if (!e) return -1;
  if (mode === 'proposed' && press && press.entry === e && press.inside && press.zone.row !== undefined) return press.zone.row;
  return e.index;
}

// ---------------------------------------------------------------- the lists
const stub = (what) => () => toast(`${what}: not in this preview`);

function popupList(e) {
  const p = P;
  if (e.page === 'main') return {
    sheet: { y: 375.7, rows: 392.5, bottom: 656.5 },
    rows: [
      { label: 'Pockets', detail: `Buttons: ${p.buttons}`, choose: () => open({ page: 'pockets', index: 0 }) },
      { label: 'Notes', choose: stub('Notes') },
      { label: 'Knobs', choose: () => open({ page: 'knobs', index: 0 }) },
      { label: 'Postcard', choose: stub('Postcard') },
      { label: 'Go home', choose: stub('Go home') },
      { label: 'Shut', choose: () => { P.open = false; render(); } },
    ],
  };
  if (e.page === 'pockets') {
    const k = p.pockets;
    return {
      sheet: { y: 383.7, rows: 400.5, bottom: 578.5 }, title: 'Pockets', caption: true,
      rows: [
        { label: 'Biscuit', detail: `x${k.biscuit}`, info: true, help: 'Gives back 40 Gusto.', enabled: k.biscuit > 0, choose: () => open({ page: 'aim', item: 'biscuit', index: firstAimable('gu') }) },
        { label: 'Soda', detail: `x${k.soda}`, info: true, help: 'Gives back 10 Spark.', enabled: k.soda > 0, choose: () => open({ page: 'aim', item: 'soda', index: firstAimable('sp') }) },
        { label: 'Feather', detail: `x${k.feather} · Fights only`, info: true, help: 'Brings back someone knocked out, in a fight.', enabled: false },
        { label: 'Return', choose: back },
      ],
    };
  }
  if (e.page === 'aim') {
    const stat = e.item === 'soda' ? 'sp' : 'gu', give = stat === 'sp' ? 10 : 40, word = stat === 'sp' ? 'Spark' : 'Gusto';
    return {
      sheet: { y: 383.7, rows: 400.5, bottom: 578.5 }, title: `${e.item} for who? ${p.pockets[e.item]} left`, aim: { stat, give },
      rows: [
        ...p.party.map((m, i) => {
          const v = m[stat], max = m[stat + 'Max'];
          const full = v >= max;
          return { label: MEMBERS[i].name, member: i, detail: full ? `${v}/${max} ${word}` : `${v} > ${Math.min(max, v + give)} ${word}`, enabled: !full, choose: () => useOn(e, i, stat, give) };
        }),
        { label: 'Return', choose: back },
      ],
    };
  }
  // knobs
  return {
    sheet: { y: 400, rows: 433.7, bottom: 656.5 }, title: 'Knobs', confetti: true, shade: true,
    rows: [
      { label: 'Loudness', step: { get: () => p.loud, set: (v) => (p.loud = v), max: 10 } },
      { label: 'Clatter', step: { get: () => p.clatter, set: (v) => (p.clatter = v), max: 10 } },
      { label: 'Buttons', choose: stub('Buttons') },
      { label: 'More knobs', choose: stub('More knobs') },
      { label: 'Return', choose: back },
    ],
  };
}

function firstAimable(stat) {
  const i = P.party.findIndex((m) => m[stat] < m[stat + 'Max']);
  return i < 0 ? P.party.length : i;
}

function useOn(e, i, stat, give) {
  const m = P.party[i];
  m[stat] = Math.min(m[stat + 'Max'], m[stat] + give);
  P.pockets[e.item] -= 1;
  toast(`${MEMBERS[i].name} gets back ${give} ${stat === 'sp' ? 'Spark' : 'Gusto'}`);
  if (P.pockets[e.item] <= 0 || firstAimable(stat) >= P.party.length) back();
  else render();
}

function fightList(e) {
  const f = F, who = f.team[f.turn];
  if (e.page === 'command') return {
    rows: [
      { label: 'Bonk', icon: 'burst', choose: () => open({ page: 'targets', act: 'bonk', index: 0 }) },
      { label: 'Sparkle', icon: 'star', choose: () => open({ page: 'sparkle', index: 0 }) },
      { label: 'Pocket', icon: 'bottle', choose: () => open({ page: 'pocket', index: 0 }) },
    ],
  };
  if (e.page === 'targets') return {
    subtitle: 'Pick one:', target: true,
    rows: [...f.foes.map((foe, i) => ({ label: foe.name, foe: i, choose: () => act(e, i) })), { label: 'Return', choose: back }],
  };
  if (e.page === 'sparkle') return {
    subtitle: `Sparkle  Spark: ${who.sp}/${who.spMax}`,
    rows: [
      { label: 'Twinkle Twirl', detail: '10 Spark', enabled: who.sp >= 10, choose: () => open({ page: 'targets', act: 'twirl', cost: 10, index: 0 }) },
      { label: 'Cherry Toss', detail: '12 Spark', enabled: who.sp >= 12, choose: () => open({ page: 'targets', act: 'toss', cost: 12, index: 0 }) },
      { label: 'Return', choose: back },
    ],
  };
  if (e.page === 'pocket') {
    const k = f.pockets, hurt = f.team.some((m) => m.gu < m.guMax), low = f.team.some((m) => m.sp < m.spMax);
    return {
      subtitle: 'Which pocket?',
      rows: [
        { label: 'Biscuit', icon: 'bottle', detail: hurt ? `x${k.biscuit}` : `x${k.biscuit} · Gusto full`, enabled: hurt && k.biscuit > 0, choose: () => open({ page: 'allies', item: 'biscuit', index: firstHurt('gu') }) },
        { label: 'Soda', icon: 'bottle', detail: low ? `x${k.soda}` : `x${k.soda} · Spark full`, enabled: low && k.soda > 0, choose: () => open({ page: 'allies', item: 'soda', index: firstHurt('sp') }) },
        { label: 'Feather', icon: 'bottle', detail: `x${k.feather} · Needs a KO`, enabled: false },
        { label: 'Return', choose: back },
      ],
    };
  }
  // allies
  const stat = e.item === 'soda' ? 'sp' : 'gu', give = stat === 'sp' ? 10 : 40, word = stat === 'sp' ? 'Spark' : 'Gusto';
  return {
    subtitle: `${e.item} for who?`, ally: true,
    rows: [
      ...f.team.map((m, i) => {
        const full = m[stat] >= m[stat + 'Max'];
        return { label: MEMBERS[i].name, member: i, detail: full ? `${word} full` : `${m[stat]} > ${Math.min(m[stat + 'Max'], m[stat] + give)}`, enabled: !full, choose: () => give_(e, i, stat, give) };
      }),
      { label: 'Return', choose: back },
    ],
  };
}

function firstHurt(stat) {
  const i = F.team.findIndex((m) => m[stat] < m[stat + 'Max']);
  return i < 0 ? 0 : i;
}

function act(e, i) {
  const who = MEMBERS[F.turn].name, foe = F.foes[i];
  if (e.cost) F.team[F.turn].sp -= e.cost;
  foe.hitAt = performance.now();
  toast(e.act === 'bonk' ? `${who} bonks ${foe.name}` : `${who}: ${e.act === 'twirl' ? 'Twinkle Twirl' : 'Cherry Toss'} on ${foe.name}`);
  nextTurn();
}

function give_(e, i, stat, give) {
  const m = F.team[i];
  m[stat] = Math.min(m[stat + 'Max'], m[stat] + give);
  F.pockets[e.item] -= 1;
  toast(`${MEMBERS[F.turn].name} gives ${MEMBERS[i].name} a ${e.item}`);
  nextTurn();
}

function nextTurn() {
  F.turn = (F.turn + 1) % F.team.length;
  F.stack = [{ page: 'command', index: 0 }];
  render();
}

function open(entry) {
  stack().push(entry);
  render();
}
function back() {
  if (stack().length > 1) stack().pop();
  render();
}

// ---------------------------------------------------------------- what is drawn now, and where it can be touched
let zones = [];
let cur = {};
const anim = { t0: -1 };

function drawPageList(g, list, entry, { interactive }) {
  const x0 = 18, w = 366, rowH = 44, u = 16, size = 17, pad = 10;
  const shown = interactive ? shownRow() : entry.index;
  const y0 = list.sheet.rows;
  const rules = el(g, 'g');
  const bandG = el(g, 'g');
  const words = el(g, 'g');
  const ptr = el(g, 'g');
  const labels = [];
  list.rows.forEach((r, i) => {
    const y = y0 + i * rowH, mid = y + rowH / 2, base = mid + size * 0.39;
    const lit = i === shown && r.enabled !== false;
    const infoW = r.info ? 44 : 0;
    if (i > 0) el(rules, 'rect', { x: x0 + pad, y, width: w - pad * 2, height: 1, fill: INK, 'fill-opacity': 0.14 });
    const lx = x0 + pad + 19;
    const t = text(words, r.label.toUpperCase(), {
      x: lx, y: base, 'font-family': OSWALD, 'font-size': size, 'font-weight': lit ? 700 : 400, fill: lit ? WHITE : r.enabled === false ? INK_FAINT : INK,
    });
    if (lit) {
      const sh = text(words, r.label.toUpperCase(), { x: lx + 1.41, y: base + 1.41, 'font-family': OSWALD, 'font-size': size, 'font-weight': 700, fill: INK });
      words.insertBefore(sh, t);
    }
    labels.push({ t, x: lx, mid });
    if (r.enabled === false) el(rules, 'rect', { x: lx - u * 0.1, y: mid - size * 0.66 + size * 1.25 * 0.55, width: width(t) + u * 0.2, height: 1.28, fill: INK_FAINT });
    if (r.step) {
      // The value between two printed keys; a tap on the words only selects the row.
      const slotX = x0 + w - 44 - 64;
      const v = r.step.get();
      text(words, `${v}/${r.step.max}`, { x: slotX + 32, y: base, 'text-anchor': 'middle', 'font-family': OSWALD, 'font-size': size, 'font-weight': i === shown ? 700 : 400, fill: i === shown ? INK : INK_SOFT });
      for (const [dir, kx] of [[-1, slotX - 44], [1, slotX + 64]]) {
        const s = 21, cx = kx + 22, cy = mid;
        const faint = dir < 0 ? v <= 0 : v >= r.step.max;
        el(words, 'rect', { x: cx - s / 2, y: cy - s / 2, width: s, height: s, fill: PAPER, stroke: INK, 'stroke-width': 1.6 });
        const a = s * 0.22;
        el(words, 'polygon', { points: poly(dir < 0 ? [cx - a * 0.8, cy, cx + a * 0.6, cy - a, cx + a * 0.6, cy + a] : [cx + a * 0.8, cy, cx - a * 0.6, cy - a, cx - a * 0.6, cy + a]), fill: faint ? INK_FAINT : INK });
        if (interactive) zones.push({ x: kx, y, w: 44, h: rowH, row: i, kind: dir < 0 ? 'left' : 'right' });
      }
      if (interactive) zones.push({ x: slotX, y, w: 64, h: rowH, row: i, kind: 'value' });
    } else if (r.detail) {
      text(words, r.detail, { x: x0 + w - infoW - pad, y: base, 'text-anchor': 'end', 'font-family': OSWALD, 'font-size': size, 'font-weight': lit ? 700 : 400, fill: lit ? INK : INK_SOFT });
    }
    if (r.info) {
      const cx = x0 + w - 22, ink = lit ? WHITE : INK_SOFT, rr = 7;
      el(words, 'circle', { cx, cy: mid, r: rr, fill: 'none', stroke: ink, 'stroke-width': 1 });
      el(words, 'circle', { cx, cy: mid - rr * 0.45, r: rr * 0.11, fill: ink });
      el(words, 'rect', { x: cx - rr * 0.1, y: mid - rr * 0.1, width: rr * 0.2, height: rr * 0.65, fill: ink });
      if (interactive) zones.push({ x: x0 + w - 44, y, w: 44, h: rowH, row: i, kind: 'info' });
    }
    if (interactive) zones.push({ x: x0, y, w: w - infoW, h: rowH, row: i, kind: 'row' });
  });
  const r = list.rows[shown];
  if (r) {
    const y = y0 + shown * rowH;
    if (r.enabled === false) {
      el(bandG, 'rect', { x: x0 + 1.28, y: y + 1.28, width: w - 2.56, height: rowH - 2.56, fill: 'none', stroke: INK_SOFT, 'stroke-width': 1.28, 'stroke-dasharray': '6 4' });
    } else {
      el(bandG, 'rect', { x: x0 + 1.28, y: y + 1.28, width: w - 2.56, height: rowH - 2.56, fill: PINK });
      el(bandG, 'rect', { x: x0 + 1.28, y: y + 0.64, width: w - 2.56, height: 1.28, fill: INK });
      el(bandG, 'rect', { x: x0 + 1.28, y: y + rowH - 1.92, width: w - 2.56, height: 1.28, fill: INK });
      const s = 32, tip = labels[shown].x - u * 0.12;
      const at = el(ptr, 'g', { transform: `translate(${Math.round(tip - s)} ${Math.round(y + rowH / 2 - s * 0.2)})` });
      const hand = glove(at, s, 1.6);
      if (interactive) cur = { band: bandG, pointer: ptr, hand, u, bandDx: -u * 0.6, ptrDx: -u * 0.9, label: null };
    }
  }
  if (interactive && !(r && r.enabled !== false)) cur = { band: bandG, pointer: ptr, hand: null, u, bandDx: -u * 0.6, ptrDx: -u * 0.9, label: null };
  // The band and glove sit under the words.
  g.insertBefore(bandG, words);
}

function drawSheet(g, list) {
  const { y, bottom } = list.sheet, x = 8, w = 386, u = 16;
  el(g, 'rect', { x, y, width: w, height: bottom - y, fill: BOX });
  el(g, 'rect', { x, y, width: w, height: 3, fill: INK });
  el(g, 'rect', { x, y: y + 3 + 2, width: w, height: 1.28, fill: INK });
  const dw = Math.min(w * 0.6, u * 16), dh = list.sheet.rows - y - u * 0.15, inset = 6;
  if (dh >= u * 0.8) el(g, 'path', { d: benDay({ x: x + w - dw - inset, y: y + inset, w: dw, h: dh - inset }, u * 0.5, [x + w - dw, y + dh], [x + w, y]), fill: CYAN, 'fill-opacity': 0.6 });
  if (list.title) {
    const size = 24, h = 30;
    const t = tab(g, list.title, { x: x + 13, y: y - h / 2, size, h, u, keyline: true });
    if (list.confetti) {
      const room = Math.min(u * 7, x + w - (x + 13 + t.w) - u * 1.4);
      if (room >= u * 1.5) confetti(g, { x: x + 13 + t.w + u * 0.6, y: y - u * 0.9, w: room, h: u * 1.8 }, u, list.title.length);
    }
  }
}

function drawPartyCard(g, i, m, opts) {

    el(c, 'rect', { x: x - 1, y: y - 1, width: w + 2, height: h + 2, fill: 'none', stroke: 'url(#aimFrame)', 'stroke-width': 5 });

}

function drawFightField(g, list, shown, now) {
  // The turn strip, a key cap and a stand-in Pause.
  el(g, 'rect', { x: 10, y: 10, width: 246, height: 60, fill: INK });

    el(cp, 'rect', { x: tx, y: 12, width: 35, height: 35 });

  el(g, 'rect', { x: 13, y: 52, width: 234, height: 10, fill: CYAN, stroke: INK, 'stroke-width': 1.2 });
  el(g, 'rect', { x: 270, y: 21, width: 22, height: 24, rx: 3, fill: PAPER, stroke: INK, 'stroke-width': 1.6 });
  text(g, 'Q', { x: 281, y: 33 + 7, 'text-anchor': 'middle', 'font-family': OSWALD, 'font-weight': 700, 'font-size': 17, fill: INK });
  el(g, 'polygon', { points: poly([308, 13, 392, 13, 382, 56, 298, 56].map((v, i) => v + 4)), fill: INK });

  // The party on the field, the one whose turn it is marked.
  const spots = [[182.7, 192.3], [108.3, 131], [182.4, 126.2]];

    el(g, 'ellipse', { cx: x, cy: y + 26, rx: 20, ry: 6, fill: INK, 'fill-opacity': 0.18 });

}

function drawFightPanel(g, list, entry) {
  const { X0, RIGHT, FOOT, lean, k, rowH } = FT;
  const u = 16 * k, pad = 10 * k, indent = 6 * k, L = 3 * k, l = 1.28 * k;
  const n = list.rows.length;
  const rowsTop = FT.lastFoot - n * rowH;
  const PT = rowsTop - (list.subtitle ? 43.7 : 20.7);
  const leftAt = (y) => lean * Math.max(0, Math.min(1, 1 - (y - PT) / (FOOT - PT)));
  const shown = shownRow();
  const command = !list.subtitle;
  const size = command ? 26 : 21.9;
  const hasIcons = list.rows.some((r) => r.icon);
  const iconS = (command ? 21 : 19) * k, iconW = hasIcons ? iconS + 5 * k : 0;
  const alpha = 0.78;
  // The leaning poster panel: its exposed shadow, see-through yellow, pink dots toward its foot, a heavy ink line.
  const shape = (d) => [X0 + lean + d, PT + d, RIGHT + d, PT + d, RIGHT + d, FOOT + d, X0 + d, FOOT + d];
  const d = 4.8 * k;
  el(g, 'polygon', { points: poly([RIGHT, PT + d, RIGHT + d, PT + d, RIGHT + d, FOOT + d, X0 + d, FOOT + d, X0 + d + (lean * d) / (FOOT - PT), FOOT, RIGHT, FOOT]), fill: INK, 'fill-opacity': alpha });
  el(g, 'polygon', { points: poly(shape(0)), fill: YELLOW, 'fill-opacity': alpha });
  el(g, 'path', {
    d: benDay({ x: X0, y: PT, w: RIGHT - X0, h: FOOT - PT }, 9.92 * k, [X0 + (RIGHT - X0) * 0.45, PT + (FOOT - PT) * 0.3], [RIGHT, FOOT], (px, py) => px > X0 + leftAt(py) + L * 2 && px < RIGHT - L * 2 && py > PT + L * 2 && py < FOOT - L * 2),
    fill: PINK, 'fill-opacity': 0.45 * alpha,
  });
  el(g, 'polygon', { points: poly(shape(0)), fill: 'none', stroke: INK, 'stroke-width': L, 'stroke-opacity': alpha, 'stroke-linejoin': 'miter' });
  const rules = el(g, 'g');
  const bandG = el(g, 'g');
  const words = el(g, 'g');
  const ptr = el(g, 'g');
  if (list.subtitle) {
    const sy = PT + 20.8;
    text(words, list.subtitle.toUpperCase(), { x: X0 + leftAt(sy + 10) + pad + indent, y: sy + 15.6 * 0.39 + 9.7, 'font-family': OSWALD, 'font-size': 15.6, 'letter-spacing': 0.5, fill: INK });
  }
  const placed = [];
  list.rows.forEach((r, i) => {
    const y = rowsTop + i * rowH, mid = y + rowH / 2;
    const enabled = r.enabled !== false;
    const lit = i === shown && enabled;
    if (i > 0) {
      const rx = X0 + leftAt(y) + pad;
      el(rules, 'rect', { x: rx, y, width: RIGHT - pad - rx, height: l, fill: INK, 'fill-opacity': 0.5 });
    }
    const left = X0 + leftAt(mid);
    let iconX = null;
    if (r.icon) {
      iconX = left + pad + u * 0.3;
      rowIcon(words, r.icon, iconX, mid - iconS / 2, iconS, l, lit ? WHITE : enabled ? INK : INK_FAINT);
    }
    const lx = left + iconW + pad + indent;
    const base = mid + size * 0.36;
    const spacing = Math.round(size * 0.05 * 10) / 10;
    const attrs = { x: lx, y: base, 'font-family': BANGERS, 'font-size': size, 'letter-spacing': spacing, fill: lit ? WHITE : enabled ? INK : INK_SOFT };
    let wordsG, t;
    if (lit) ({ g: wordsG, t } = posterWords(words, r.label.toUpperCase(), attrs, { outline: Math.max(2, Math.round(size * 0.13)), extrude: Math.max(2, Math.round(size * 0.09)) * 0.7 }));
    else { wordsG = el(words, 'g'); t = text(wordsG, r.label.toUpperCase(), attrs); }
    if (!enabled) el(rules, 'rect', { x: lx - u * 0.1, y: mid - l / 2, width: width(t) + u * 0.2, height: l, fill: INK_SOFT });
    if (r.detail) text(words, r.detail, { x: RIGHT - pad, y: mid + 17.7 * 0.39, 'text-anchor': 'end', 'font-family': OSWALD, 'font-size': 17.7, 'font-weight': lit ? 700 : 400, fill: enabled ? INK : INK_SOFT });
    placed.push({ lx, iconX, mid, wordsG });
    zones.push({ x: X0, y, w: RIGHT - X0, h: rowH, row: i, kind: 'row' });
  });
  const r = list.rows[shown];
  cur = { band: bandG, pointer: ptr, hand: null, u, bandDx: -u * 1.1, ptrDx: -u * 1.6, label: null };
  if (r) {
    const y = rowsTop + shown * rowH + l, h = rowH - l * 2;
    const inset = L / 2 + l;
    const xt = X0 + leftAt(y) + inset, xb = X0 + leftAt(y + h) + inset, right = RIGHT - inset;
    if (r.enabled === false) {
      el(bandG, 'polygon', { points: poly([xt, y, right, y, right, y + h, xb, y + h]), fill: 'none', stroke: INK_SOFT, 'stroke-width': l, 'stroke-dasharray': '6 4' });
    } else {
      const out = u * 0.5;
      el(bandG, 'polygon', { points: poly([xt - out, y, right, y, right, y + h, xb - out, y + h]), fill: PINK, 'fill-opacity': alpha });
      el(bandG, 'path', { d: `M${xt - out},${y}H${right}M${xb - out},${y + h}H${right}`, stroke: INK, 'stroke-width': l, 'stroke-opacity': alpha });
      const s = 45 * k;
      const p = placed[shown];
      const tip = (p.iconX ?? p.lx) - u * 0.12;
      const at = el(ptr, 'g', { transform: `translate(${tip - s} ${rowsTop + shown * rowH + rowH / 2 - s * 0.2})` });
      cur.hand = glove(at, s, 1.6 * k);
      cur.label = { g: p.wordsG, x: p.lx, y: p.mid };
    }
  }
  g.insertBefore(bandG, words);
  // The member's name on its tab, pink, turned a little.
  tab(g, MEMBERS[F.turn].name, { x: X0 + lean + u * 0.5, y: PT - 15.6, size: 25, h: 31.2, u, ink: 'pink', keyline: true, rotate: -0.07 });
}

function renderFight(g, now) {
  const e = topEntry();
  const list = fightList(e);
  const shown = shownRow();
  drawStreet(g);
  drawFightField(g, list, shown, now);
  drawFightCards(g, list, shown);
  drawFightPanel(g, list, e);
}

function render() {
  zones = [];
  cur = {};
  root.textContent = '';
  const g = el(root, 'g');
  if (screen === 'popup') renderPopup(g);
  else renderFight(g, performance.now());
  applyMotion(performance.now());
}

// ---------------------------------------------------------------- motion: the band and glove's slide, the glove's poke on the beat
function applyMotion(now) {
  const t = now / 1000;
  if (cur.hand) cur.hand.setAttribute('transform', `translate(${(onBeat(t) * cur.u * 0.22).toFixed(2)} 0)`);
  if (anim.t0 >= 0 && cur.band) {
    const k = Math.min(1, (now - anim.t0) / 110), e = pop(k);
    cur.band.setAttribute('transform', `translate(${(cur.bandDx * (1 - e)).toFixed(2)} 0)`);
    cur.pointer?.setAttribute('transform', `translate(${(cur.ptrDx * (1 - e)).toFixed(2)} 0)`);
    let k2 = 1;
    if (cur.label) {
      k2 = Math.min(1, (now - anim.t0) / 130);
      const s = 1 + 0.3 * (1 - pop(k2)), { x, y } = cur.label;
      cur.label.g.setAttribute('transform', `translate(${x} ${y}) scale(${s.toFixed(3)}) translate(${-x} ${-y})`);
    }
    if (k >= 1 && k2 >= 1) anim.t0 = -1;
  }
  if (screen === 'fight') for (const foe of F.foes) {
    if (foe.hitAt < 0 || !foe.el) continue;
    const k = (now - foe.hitAt) / 320;
    foe.el.setAttribute('transform', `translate(${k < 1 ? (Math.sin(k * 40) * 5 * (1 - k)).toFixed(2) : 0} 0)`);
    if (k >= 1) foe.hitAt = -1;
  }
}
function frame(now) {
  applyMotion(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- touch
function toStage(e) {
  const r = stage.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * 402, y: ((e.clientY - r.top) / r.height) * 681 };
}
function hit(p) {
  // Keys, values and info marks lie over their row, so they are found first.
  let best = null;
  for (const z of zones) if (p.x >= z.x && p.x < z.x + z.w && p.y >= z.y && p.y < z.y + z.h) {
    if (!best || (best.kind === 'row' && z.kind !== 'row')) best = z;
  }
  return best;
}
const sameZone = (a, b) => a && b && a.kind === b.kind && a.row === b.row && a.x === b.x && a.y === b.y;

// The cursor moves to a row: the band and glove slide in, and whatever follows the cursor follows.
function point(i) {
  const e = topEntry();
  if (e.index === i) return;
  e.index = i;
  moved();
}
function moved() {
  anim.t0 = performance.now();
  render();
}

function listNow() {
  return screen === 'popup' ? popupList(topEntry()) : fightList(topEntry());
}

function tapZone(z) {
  if (z.kind === 'button') return z.action();
  const e = topEntry();
  const list = listNow();
  const r = list.rows[z.row];
  if (!r) return;
  const was = e.index;
  e.index = z.row;
  if (was !== z.row) anim.t0 = performance.now();
  if (z.kind === 'info') return render();
  if (z.kind === 'left' || z.kind === 'right') {
    const v = r.step.get(), nv = Math.max(0, Math.min(r.step.max, v + (z.kind === 'left' ? -1 : 1)));
    r.step.set(nv);
    return render();
  }
  if (z.kind === 'value') {
    const v = r.step.get();
    r.step.set(v >= r.step.max ? 0 : v + 1);
    return render();
  }
  if (r.step) return render();
  if (r.enabled === false) {
    toast('Greyed out');
    return render();
  }
  r.choose ? r.choose() : render();
}

stage.addEventListener('pointerdown', (ev) => {
  if (press) return;
  ev.preventDefault();
  const p = toStage(ev);
  const z = hit(p);
  press = { id: ev.pointerId, zone: z, entry: topEntry(), inside: true };
  try { stage.setPointerCapture(ev.pointerId); } catch {}
  if (!z || z.kind === 'button') return;
  if (mode === 'today') {
    // A finger landing on a row (or its keys or value) moves the cursor there.
    if (z.kind !== 'info') point(z.row);
  } else if (z.row !== press.entry.index) moved();
});

stage.addEventListener('pointermove', (ev) => {
  if (!press || ev.pointerId !== press.id) return;
  const z = hit(toStage(ev));
  if (!press.zone || press.zone.kind === 'button') return;
  if (mode === 'today') {
    // As the finger crosses into another row's words, keys or value, the cursor follows it there.
    if (z && z.kind !== 'info' && z.kind !== 'button' && z.row !== topEntry().index) point(z.row);
  } else {
    const inside = Boolean(z && z.kind !== 'button' && z.row === press.zone.row);
    if (inside !== press.inside) {
      press.inside = inside;
      moved();
    }
  }
});

function release(ev, cancelled) {
  if (!press || ev.pointerId !== press.id) return;
  const p = press;
  press = null;
  const z = cancelled ? null : hit(toStage(ev));
  if (sameZone(z, p.zone) && topEntry() === p.entry) return tapZone(z);
  if (!p.zone || p.zone.kind === 'button') return;
  if (mode === 'proposed') {
    // Off the row the band is already back on the remembered row; on another part of the same row it goes back now.
    if (p.inside && p.zone.row !== p.entry.index) moved();
    toast(p.inside ? 'Let go on another part of the row: nothing chosen' : 'Let go off the row it pressed: nothing chosen');
  } else {
    toast(z && z.row !== undefined && z.row !== p.zone.row ? 'Let go on another row: nothing chosen' : 'Let go off the row: nothing chosen');
  }
}
stage.addEventListener('pointerup', (ev) => release(ev, false));
stage.addEventListener('pointercancel', (ev) => release(ev, true));
document.addEventListener('contextmenu', (ev) => ev.preventDefault());

// ---------------------------------------------------------------- the bar
let toastTimer = 0;
function toast(s) {
  toastEl.textContent = s;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}
function setSeg(a, b, on) {
  document.getElementById(a).classList.toggle('on', on);
  document.getElementById(b).classList.toggle('on', !on);
}
function bind(id, fn) {
  document.getElementById(id).addEventListener('click', fn);
}
bind('sPopup', () => { screen = 'popup'; setSeg('sPopup', 'sFight', true); press = null; anim.t0 = -1; render(); });
bind('sFight', () => { screen = 'fight'; setSeg('sPopup', 'sFight', false); press = null; anim.t0 = -1; render(); });
bind('mToday', () => { mode = 'today'; setSeg('mToday', 'mProposed', true); press = null; render(); toast('Today: the cursor follows the finger'); });
bind('mProposed', () => { mode = 'proposed'; setSeg('mToday', 'mProposed', false); press = null; render(); toast('Proposed: the press stays with its row'); });
bind('reset', () => { if (screen === 'popup') resetPopup(); else resetFight(); press = null; anim.t0 = -1; render(); });

function fit() {
  const bar = document.getElementById('bar').getBoundingClientRect().height;
  const w = window.innerWidth, h = window.innerHeight - bar;
  const s = Math.min(w / 402, h / 681);
  stage.style.width = `${402 * s}px`;
  stage.style.height = `${681 * s}px`;
  stage.style.left = `${Math.round((w - 402 * s) / 2)}px`;
  stage.style.top = `${bar}px`;
  toastEl.style.top = `${bar + 8}px`;
}
window.addEventListener('resize', fit);
window.visualViewport?.addEventListener('resize', fit);

// The fonts are inside this file; the words are measured once they are ready.
Promise.all(['17px Oswald', '700 17px Oswald', '24px Bangers', 'italic 15px "Old Standard TT"'].map((f) => document.fonts.load(f))).finally(() => {
  fit();
  const q = new URLSearchParams(location.search);
  if (q.get('screen') === 'fight') { screen = 'fight'; setSeg('sPopup', 'sFight', false); }
  if (q.get('mode') === 'today') { mode = 'today'; setSeg('mToday', 'mProposed', true); }
  render();
  requestAnimationFrame(frame);
  window.__preview = { ready: true, state: () => ({ screen, mode, stack: stack().map((e) => ({ ...e })), shown: shownRow(), P, F }), zones: () => zones };
});
</script>
