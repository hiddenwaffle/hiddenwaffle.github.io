<script>
/* ===== Music worker body (stringified into a Blob): simulates the real game's in-page music synthesis ===== */
function workerMain(){
const SR=44100,TAU=Math.PI*2;
// name: [wave 0 sine/1 square/2 saw/3 noise, f0, f1, seconds, volume]  (30 effects)
const FX={step:[3,400,200,.05,.15],select:[1,660,880,.06,.2],confirm:[1,520,1040,.12,.22],back:[1,520,260,.1,.2],error:[2,150,110,.2,.22],open:[0,400,800,.15,.3],close:[0,800,400,.15,.3],hit:[3,900,150,.18,.45],crit:[3,1400,100,.3,.5],miss:[3,2000,600,.2,.2],hurt:[2,300,80,.25,.4],special:[2,200,1600,.5,.35],charge:[0,100,900,.6,.4],cutin:[3,300,3000,.35,.35],heal:[0,500,1500,.5,.35],revive:[0,300,2400,1.1,.4],pickup:[1,700,1400,.18,.25],burst:[3,3000,300,.5,.3],explosion:[3,500,40,1.6,.7],whoosh:[3,200,2000,.3,.25],win:[1,440,880,.9,.25],lose:[2,330,60,1.2,.3],save:[0,600,900,.3,.3],coin:[1,900,1350,.15,.2],alert:[1,500,800,.3,.2],talk:[0,300,320,.08,.2],sparkle:[0,2000,3000,.4,.2],thud:[0,120,40,.25,.5],slash:[3,2500,500,.15,.35],flee:[2,600,200,.4,.25]};
const TR={town:{bpm:90,seed:11,root:3,scale:[0,2,4,5,7,9,11],prog:[0,5,3,4],dens:.55,ld:3.5,kk:8,hatAll:false,arp:true},
battle:{bpm:150,seed:22,root:0,scale:[0,2,3,5,7,8,10],prog:[0,5,6,4],dens:.8,ld:6,kk:4,hatAll:true,arp:true},
boss:{bpm:160,seed:33,root:1,scale:[0,1,3,5,7,8,10],prog:[0,1,0,4],dens:.9,ld:8,kk:4,hatAll:true,arp:true}};
function synth(w,f0,f1,dur,vol){ // one short effect / blip, sample by sample
  const n=Math.round(dur*SR),o=new Float32Array(n);let ph=0,lp=0,z=1;
  for(let i=0;i<n;i++){const t=i/n,f=f0+(f1-f0)*t;ph+=f/SR;ph-=Math.floor(ph);let v;
    if(w===0)v=Math.sin(ph*TAU);else if(w===1)v=ph<.5?1:-1;else if(w===2)v=ph*2-1;
    else{z=(z*1664525+1013904223)>>>0;lp+=((z/2147483648-1)-lp)*Math.min(1,f/4000+.05);v=lp*2.2}
    o[i]=v*vol*Math.pow(1-t,2)*Math.min(1,i/150)}
  return o}
function music(sec,p){ // lead + arp + 3-voice detuned pad + bass + drum noise + feedback-comb reverb
  const n=Math.round(sec*SR),L=new Float32Array(n),R=new Float32Array(n);
  let sd=p.seed;const rn=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
  const fr=(deg,oct)=>{const d=Math.floor(deg/7),k=((deg%7)+7)%7;return 27.5*Math.pow(2,(p.root+p.scale[k]+12*(oct+d))/12)};
  const mel=[];let dd=7;for(let i=0;i<64;i++){dd=Math.max(0,Math.min(14,dd+Math.floor(rn()*5)-2));mel.push(rn()<p.dens?dd:-1)}
  const step=Math.round(60/p.bpm/4*SR),mk=a=>a.map(l=>({b:new Float32Array(l),i:0}));
  const cL=mk([1557,1617,1491,1422]),cR=mk([1640,1580,1513,1451]);
  let pl=0,pa=0,pb=0,kp=0,nz=1,i=0;const pp=[0,0,0],pq=[0,0,0];
  for(let s=0;i<n;s++){
    const root=p.prog[(s>>4)&3],st=s&15,mi=mel[s&63];
    const lf=mi>=0?fr(mi,4):0,af=p.arp?fr(root+[0,2,4,2][st&3],4):0,bf=fr(root,1);
    const kick=st%p.kk===0,snare=st%8===4,hat=p.hatAll||st%2===0;
    const pf=[fr(root,3),fr(root+2,3),fr(root+4,3)],len=Math.min(step,n-i);
    for(let j=0;j<len;j++,i++){
      const e=j/SR;let m=0;
      if(lf){pl+=lf/SR;pl-=Math.floor(pl);m+=(pl<.5?.2:-.2)*Math.exp(-e*p.ld)}
      if(af){pa+=af/SR;pa-=Math.floor(pa);m+=(Math.abs(pa*4-2)-1)*.12*Math.exp(-e*9)}
      pb+=bf/SR;pb-=Math.floor(pb);m+=(Math.sin(pb*TAU)*.35+(pb*2-1)*.1)*Math.exp(-e*3);
      let pd=0,pe=0;
      for(let k=0;k<3;k++){pp[k]+=pf[k]/SR;pp[k]-=Math.floor(pp[k]);pq[k]+=pf[k]*1.005/SR;pq[k]-=Math.floor(pq[k]);pd+=pp[k]*2-1;pe+=pq[k]*2-1}
      nz=(nz*1664525+1013904223)>>>0;const nv=nz/2147483648-1;let d=0;
      if(kick){kp+=(45+140*Math.exp(-e*28))/SR;kp-=Math.floor(kp);d+=Math.sin(kp*TAU)*Math.exp(-e*7)*.5}
      if(snare)d+=nv*Math.exp(-e*16)*.25;
      if(hat)d+=nv*Math.exp(-e*70)*.1;
      const dl=m+pd*.04+d,dr=m+pe*.04+d;let wl=0,wr=0;
      for(let c=0;c<4;c++){let o=cL[c],y=o.b[o.i];o.b[o.i]=dl+y*.8;if(++o.i>=o.b.length)o.i=0;wl+=y;
        o=cR[c];y=o.b[o.i];o.b[o.i]=dr+y*.8;if(++o.i>=o.b.length)o.i=0;wr+=y}
      L[i]=Math.tanh(dl+wl*.1);R[i]=Math.tanh(dr+wr*.1)}}
  return [L,R]}
onmessage=e=>{const j=e.data,t0=performance.now();
  if(j.k==='fx'){const items=[],tr=[];let sec=0;
    const add=(n,a)=>{items.push({n,d:a});tr.push(a.buffer);sec+=a.length/SR};
    for(const n in FX)add(n,synth(...FX[n]));
    [260,320,390,470,560].forEach((f,i)=>add('blip'+i,synth(1,f,f*1.04,.06,.16)));
    postMessage({k:'fx',name:'effects',sec,ms:performance.now()-t0,items},tr)}
  else{const r=music(j.sec,TR[j.t]);postMessage({k:'m',name:j.name,sec:j.sec,ms:performance.now()-t0,L:r[0],R:r[1]},[r[0].buffer,r[1].buffer])}};
}

(async()=>{
const T=32,MW=30,MH=115,WW=MW*T,WH=MH*T;
const $=id=>document.getElementById(id);
let scene='loading',W=innerWidth,H=innerHeight,app,world,ui,sortC,fxW,groundC,halftone,hu,leader=null,zoom=1,scr=null,res=1;
let npcs=[],patrols=[],boxes=[],objs=[],chunks=[],drawnCount=0,bt=null,bat=null,fxTop=null,dlg=null,list=null,hits=[],chNext=null;
let texN=0,texBytes=0,bossDone=false,pk=null,pkT=0,bossM=null,SA={t:0,r:0,b:0,l:0};
const cam={x:0,y:0},TEX={g:null,tiles:[],pages:[],bld:[],bg:[],prop:[]},S={music:.7,sfx:.8,reduce:false};
const inv={potion:3,revive:2},astarLog=[];
// --- helpers
let seed=12345;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rnd()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hsl=(h,s,l)=>`hsl(${((h%360)+360)%360|0},${s}%,${l}%)`,wait=ms=>new Promise(r=>setTimeout(r,ms));
const rgb=()=>(RI(70,230)<<16)|(RI(70,230)<<8)|RI(70,230),easeOut=p=>1-(1-p)*(1-p);
const party=[['Ash',0xe0605a,0xf2d04a,true],['Birch',0x58b46a,0x4a7ad8,false],['Cedar',0x6a7ae0,0xe08a3a,true]].map(([name,col,band,hat],i)=>({name,col,band,hat,hatc:0x884422,maxHp:120,hp:120,maxMp:24,mp:24,atk:i,i,dir:0,frame:0,walk:false,af:0,blink:false,bt:2,x:480,y:3560,key:''}));
const LINES=['Lovely weather for a walk, is it not?','The road north is long and a little bumpy.','I counted every stone on this street once.','Have you tried the soup? It is just soup, but warm.','Somebody keeps leaving crates in the way.','Mind the patrols. They are in a hurry today.','I am only here to fill a place on the map.','This town has a great many people, I find.','Nothing to report. Nothing at all. Splendid.','If you see a shiny thing on the ground, take it.'];
const blocked=new Uint8Array(MW*MH);

/* ===== Stats overlay (cheap DOM text, refreshed twice a second) ===== */
const st=$('stats');let big=true,gpu='n/a';const F={fr:[],over:0,last:performance.now()};
st.onpointerdown=e=>{e.stopPropagation();big=!big};
function frameStat(now){const d=now-F.last;F.last=now;if(d>33)F.over++;F.fr.push([now,d])}
setInterval(()=>{const now=performance.now();while(F.fr.length&&F.fr[0][0]<now-5000)F.fr.shift();
  let worst=0,c1=0;for(const[t,d]of F.fr){if(d>worst)worst=d;if(t>now-1000)c1++}
  let s=`fps ${c1} worst5s ${worst.toFixed(0)}ms >33ms:${F.over}`;
  if(big){s+=`\ndpr ${devicePixelRatio} res ${res}\ngpu ${gpu}`;
    if(performance.memory)s+=`\nheap ${(performance.memory.usedJSHeapSize/1048576).toFixed(0)} MB`;
    s+=`\ntextures ${texN}  ${(texBytes/1048576).toFixed(1)} MB decoded`;
    for(const r of A.renders)s+=`\nrender ${r.name} ${r.seconds.toFixed(0)}s audio: ${(r.renderMs/1000).toFixed(2)}s`}
  st.textContent=s},500);

/* ===== Audio: worker-rendered buffers, Web Audio graph with compressor + separate gains ===== */
const A={ctx:null,mg:null,sg:null,pend:[],buf:{},cur:null,want:null,renders:[],last:{}};
const worker=new Worker(URL.createObjectURL(new Blob(['('+workerMain+')()'],{type:'text/javascript'})));
worker.onmessage=e=>{const m=e.data;A.renders.push({name:m.name,seconds:m.sec,renderMs:m.ms});
  if(m.k==='fx')for(const it of m.items)A.pend.push([it.n.startsWith('blip')?it.n:'fx:'+it.n,[it.d]]);else A.pend.push([m.name,[m.L,m.R]]);
  flush()};
// render in the order the player needs them: town (5 s first), effects, full town, then fight tracks
[{k:'m',name:'town-5s',t:'town',sec:5},{k:'fx'},{k:'m',name:'town',t:'town',sec:168},{k:'m',name:'battle-5s',t:'battle',sec:5},{k:'m',name:'battle',t:'battle',sec:96},{k:'m',name:'boss-5s',t:'boss',sec:5},{k:'m',name:'boss',t:'boss',sec:45}].forEach(j=>worker.postMessage(j));
function flush(){if(!A.ctx)return;while(A.pend.length){const[n,ch]=A.pend.shift(),b=A.ctx.createBuffer(ch.length,ch[0].length,44100);ch.forEach((c,i)=>b.copyToChannel(c,i));A.buf[n]=b}
  if(A.want)playMusic(A.want)}
function unlock(){if(!A.ctx){try{const c=A.ctx=new(window.AudioContext||window.webkitAudioContext)(),comp=c.createDynamicsCompressor();
  A.mg=c.createGain();A.sg=c.createGain();A.mg.connect(comp);A.sg.connect(comp);comp.connect(c.destination);setVol();flush()}catch(e){}}
  if(A.ctx&&A.ctx.state!=='running')A.ctx.resume().catch(()=>{})}
function setVol(){if(A.ctx){A.mg.gain.value=S.music*.55;A.sg.gain.value=S.sfx}}
function playMusic(base){A.want=base;const c=A.ctx;if(!c)return;
  if(A.cur&&A.cur.base===base&&(A.cur.full||!A.buf[base]))return;
  const b=A.buf[base]||A.buf[base+'-5s'];const t=c.currentTime,o=A.cur;
  if(o){o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+1.2);o.src.stop(t+1.3)}
  A.cur=null;if(!b)return;
  const g=c.createGain(),src=c.createBufferSource();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+1.2);
  src.buffer=b;src.loop=true;src.connect(g);g.connect(A.mg);src.start();A.cur={base,full:!!A.buf[base],src,g}}
function sfx(n,rate=1){const c=A.ctx,b=A.buf['fx:'+n]||A.buf[n];if(!c||!b)return;const now=performance.now();if(now-(A.last[n]||0)<35)return;A.last[n]=now;
  const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rate;s.connect(A.sg);s.start()}
const blip=v=>sfx('blip'+v,.95+rnd()*.1);

/* ===== Test hooks (filled as things exist) ===== */
const P=window.proto={app:null,scene:()=>scene,leader:()=>leader?{x:leader.x,y:leader.y}:{x:0,y:0},
  toScreen:(x,y)=>{const r=app.canvas.getBoundingClientRect();return{x:r.left+(x-cam.x)*zoom,y:r.top+(y-cam.y)*zoom}},
  counts:()=>{const now=performance.now();while(astarLog.length&&astarLog[0]<now-1000)astarLog.shift();
    return{npcs:npcs.length,npcsDrawn:drawnCount,patrols:patrols.length,chasing:patrols.filter(p=>p.chase).length,collisionBoxes:boxes.length,objects:objs.length,textures:texN,textureMB:+(texBytes/1048576).toFixed(2),astarPerSecond:astarLog.length}},
  music:()=>({renders:A.renders.map(r=>({name:r.name,seconds:r.seconds,renderMs:Math.round(r.renderMs)})),playing:A.ctx&&A.ctx.state==='running'&&A.cur?A.cur.base:null,contextState:A.ctx?A.ctx.state:'none'}),
  battle:()=>bt?{boss:bt.boss,party:bt.party.map(m=>({hp:m.hp,maxHp:m.maxHp})),enemies:bt.enemies.map(e=>({hp:e.hp,maxHp:e.maxHp})),effect:bt.effect}:null,
  debug:{battle:b=>{if(bt||!groundC)return;if(dlg&&dlg.n)dlg.n.talking=false;startBattle(!!b,null)},
    revive:()=>{if(bt)reviveFx(bt.party[0])},
    nearestNpc:()=>near(npcs),nearestPatrol:()=>near(patrols),pickup:()=>pk?{x:pk.x,y:pk.y}:null}};
function near(a){let b=null,bd=1e9;for(const o of a){const d=Math.hypot(o.x-leader.x,o.y-leader.y);if(d<bd){bd=d;b=o}}return b?{x:b.x,y:b.y}:null}

/* ===== Fonts (Google Fonts <link>), waited for before the game starts ===== */
await Promise.race([Promise.all([document.fonts.load('32px Bangers'),document.fonts.load('20px Oswald'),document.fonts.load('600 20px Oswald')]).catch(()=>{}),wait(4000)]);

/* ===== Renderer ===== */
app=new PIXI.Application();res=Math.min(devicePixelRatio||1,3);
await app.init({preference:'webgl',antialias:true,resolution:res,autoDensity:true,resizeTo:window,background:0x0b1020,textureGCActive:false});
document.body.appendChild(app.canvas);P.app=app;res=app.renderer.resolution;
try{const gl=app.renderer.gl,x=gl.getExtension('WEBGL_debug_renderer_info');gpu=String(x?gl.getParameter(x.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER))}catch(e){}
world=new PIXI.Container();ui=new PIXI.Container();app.stage.addChild(world,ui);
groundC=new PIXI.Container();sortC=new PIXI.Container();sortC.sortableChildren=true;fxW=new PIXI.Container();world.addChild(groundC,sortC,fxW);world.visible=false;

/* ===== CMYK halftone filter over the whole map layer: four rotated dot screens per pixel ===== */
const VERT=`in vec2 aPosition;out vec2 vTextureCoord;uniform vec4 uInputSize;uniform vec4 uOutputFrame;uniform vec4 uOutputTexture;
vec4 filterVertexPosition(void){vec2 position=aPosition*uOutputFrame.zw+uOutputFrame.xy;position.x=position.x*(2.0/uOutputTexture.x)-1.0;position.y=position.y*(2.0*uOutputTexture.z/uOutputTexture.y)-uOutputTexture.z;return vec4(position,0.0,1.0);}
vec2 filterTextureCoord(void){return aPosition*(uOutputFrame.zw*uInputSize.zw);}
void main(void){gl_Position=filterVertexPosition();vTextureCoord=filterTextureCoord();}`;
const FRAG=`in vec2 vTextureCoord;out vec4 finalColor;uniform sampler2D uTexture;uniform float uCell;uniform float uOx;uniform float uOy;
float dotScreen(vec2 p,float ang,float v){float s=sin(ang),c=cos(ang);vec2 q=vec2(c*p.x+s*p.y,-s*p.x+c*p.y)/uCell;vec2 f=fract(q)-0.5;float r=sqrt(clamp(v,0.0,1.0))*0.72;return 1.0-smoothstep(r-0.12,r+0.12,length(f));}
void main(void){vec4 col=texture(uTexture,vTextureCoord);vec3 rgb=col.a>0.0?col.rgb/col.a:col.rgb;
float k=1.0-max(rgb.r,max(rgb.g,rgb.b));vec3 cmy=clamp((1.0-rgb-vec3(k))/(1.0-k+0.0001),0.0,1.0);
vec2 p=gl_FragCoord.xy+vec2(uOx,uOy);
float c=dotScreen(p,0.2618,cmy.x),m=dotScreen(p,1.309,cmy.y),y=dotScreen(p,0.0,cmy.z),kk=dotScreen(p,0.7854,k);
vec3 ink=vec3(1.0-c,1.0-m,1.0-y)*(1.0-kk);finalColor=vec4(mix(rgb,ink,0.85)*col.a,col.a);}`;
hu=new PIXI.UniformGroup({uCell:{value:5*res,type:'f32'},uOx:{value:0,type:'f32'},uOy:{value:0,type:'f32'}});
halftone=new PIXI.Filter({glProgram:PIXI.GlProgram.from({vertex:VERT,fragment:FRAG,name:'halftone'}),resources:{hu},resolution:res});
world.filters=[halftone];world.filterArea=new PIXI.Rectangle(0,0,W,H);

/* ===== UI toolkit (everything laid out in CSS pixels) ===== */
const txt=(s,size=18,fill=0xffffff,font='Oswald',extra={})=>new PIXI.Text({text:s,style:{fontFamily:font,fontSize:size,fill,...extra}});
function panel(c,x,y,w,h,a=.88){c.addChild(new PIXI.Graphics().roundRect(x,y,w,h,10).fill({color:0x121a36,alpha:a}).stroke({width:2,color:0xf3e6a0}))}
function clearUI(){list=null;hits=[];ui.removeChildren().forEach(c=>c.destroy({children:true}))}
function btn(label,x,y,w,h,fn){const c=new PIXI.Container();c.addChild(new PIXI.Graphics().roundRect(x,y,w,h,8).fill({color:0x2a3568,alpha:.9}).stroke({width:2,color:0xf3e6a0}));
  const t=txt(label,18);t.anchor.set(.5);t.position.set(x+w/2,y+h/2);c.addChild(t);ui.addChild(c);hits.push({x,y,w,h,fn})}
function mkList(items,x,y,w,o={}){ // keyboard + tap menu
  const c=new PIXI.Container();(o.parent||ui).addChild(c);
  const rh=o.rh||36,L={items,sel:o.sel||0,c,back:o.back,h:o.h,rows:[]};
  items.forEach((it,i)=>{const r=new PIXI.Container(),bg=new PIXI.Graphics(),t=txt(it.t,20);t.position.set(12,rh/2-15);r.addChild(bg,t);r.position.set(x,y+i*rh);c.addChild(r);L.rows.push({bg,t});
    if(!o.noRows)hits.push({x,y:y+i*rh,w,h:rh-3,fn:()=>{L.sel=i;L.hl();L.ok()}})});
  L.hl=()=>{L.rows.forEach((r,i)=>{r.bg.clear().roundRect(0,0,w,rh-3,6).fill({color:i===L.sel?0x4f62b0:0x1b2342,alpha:.92});r.t.style.fill=L.items[i].off?0x777788:0xffffff});if(o.onsel)o.onsel(L.sel)};
  L.move=d=>{L.sel=(L.sel+d+items.length)%items.length;sfx('select');L.hl()};
  L.ok=()=>{const it=items[L.sel];if(it.off){sfx('error');return}sfx('confirm');if(it.fn)it.fn()};
  L.set=(i,s)=>{L.rows[i].t.text=s};
  if(o.noRows)c.visible=false;
  list=L;L.hl();return L}
const cover=(tex)=>{const s=new PIXI.Sprite(tex);s.anchor.set(.5);s.scale.set(Math.max(W/tex.width,H/tex.height));s.position.set(W/2,H/2);return s};
const centerTxt=(s,size,fill,font,y,extra)=>{const t=txt(s,size,fill,font,extra);t.anchor.set(.5);t.position.set(W/2,y);ui.addChild(t);return t};

/* ===== Tweens / timed effects (driven by the ticker) ===== */
const anims=[];
const anim=(ms,fn)=>new Promise(res=>anims.push({t:0,ms,fn,res}));
const tw=(o,to,ms,ease=p=>p)=>{const f={};for(const k in to)f[k]=o[k];return anim(ms,p=>{const e=ease(p);for(const k in to)o[k]=f[k]+(to[k]-f[k])*e})};

/* ===== Generated textures: 93 canvases, ~99 MiB decoded, uploaded to the GPU during loading ===== */

const alive=a=>a.filter(c=>c.hp>0),setMsg=s=>{if(bat&&bat.msg&&!bat.msg.destroyed)bat.msg.text=s};
function monster(g,c,boss){const ol={width:3,color:0x1a1a2a};g.ellipse(0,-20,26,22).fill(c).stroke(ol);

function drawBar(c){if(!c.bar||c.bar.destroyed)return;const f=Math.max(0,c.hp)/c.maxHp;c.bar.clear().rect(-32,0,64,7).fill(0x222233).rect(-32,0,64*f,7).fill(f>.35?0x5ad06a:0xe05a4a);

function startBattle(boss,patrol){
  if(bt)return;clearUI();sfx('alert');world.visible=false;scene='battle';anims.length=0;if(dlg){dlg=null}
  bat=new PIXI.Container();app.stage.addChildAt(bat,1);bat.filters=[halftone];bat.filterArea=new PIXI.Rectangle(0,0,W,H);hu.uniforms.uOx=0;hu.uniforms.uOy=0;bat.bg=cover(TEX.bg[boss?1:RI(0,4)]);bat.addChild(bat.bg);

  enemies.forEach(e=>e.maxHp=e.hp);
  bt={boss,patrol,party,enemies,qi:-1,cmds:[],turn:0,effect:null,busy:false,win:false};
  const mk=(c,isP)=>{c.isP=isP;c.cont=new PIXI.Container();c.fig=new PIXI.Graphics();c.cont.addChild(c.fig);bat.addChild(c.cont);
    c.hud=new PIXI.Container();c.bar=new PIXI.Graphics();c.label=txt('',13,0xffffff,'Oswald',{stroke:{color:0,width:3}});c.label.anchor.set(.5,0);c.label.position.y=8;c.hud.addChild(c.bar,c.label);bat.addChild(c.hud);
    if(isP)drawFig({...c,dir:0,frame:0,walk:false,blink:false,talk:false},c.fig);else monster(c.fig,c.col,boss);
    c.cont.alpha=c.hp>0?1:.35;drawBar(c)};
  party.forEach(m=>mk(m,true));enemies.forEach(e=>mk(e,false));
  fxTop=new PIXI.Container();bat.addChild(fxTop);bat.msg=txt('',22,0xffffff,'Bangers',{stroke:{color:0,width:4}});bat.msg.anchor.set(.5,0);bat.addChild(bat.msg);
  bat.pops=[];bat.pi=0;for(let i=0;i<10;i++){const t=txt('',36,0xffffff,'Bangers',{stroke:{color:0,width:5}});t.anchor.set(.5);t.visible=false;bat.addChild(t);bat.pops.push(t)}
  layoutBattle();scr=()=>{layoutBattle();if(bt&&scene==='battle'&&!bt.busy)cmdMenu()};
  playMusic(boss?'boss':'battle');nextCmd()}
function layoutBattle(){if(!bat)return;bat.filterArea.width=W;bat.filterArea.height=H;bat.bg.scale.set(Math.max(W/1024,H/1024));bat.bg.position.set(W/2,H/2);
  const u=clamp(Math.min(W/420,H/330),.7,1.8),ey=H*.3,py=clamp(H-160-SA.b-14,H*.5,H*.68);
  bt.party.forEach((m,i)=>{m.u=u*1.7;m.h=48*m.u;m.bx=W/2+(i-1)*Math.min(W*.16,110*u);m.by=py;m.fig.scale.set(m.u)});
  bt.enemies.forEach((e,i)=>{const s=u*(bt.boss?3.6:1.8);e.u=s;e.h=56*s;e.bx=W/2+(i-(bt.enemies.length-1)/2)*Math.min(W*.24,150*u);e.by=ey+(bt.boss?40:0);e.fig.scale.set(s)});
  for(const c of[...bt.party,...bt.enemies]){c.cont.position.set(c.bx,c.by);c.hud.position.set(c.bx,c.by+6)}
  bat.msg.position.set(W/2,10+SA.t)}
function cmdMenu(){if(!bt||scene!=='battle')return;clearUI();const m=bt.party[bt.qi];setMsg(m.name+"'s turn");
  const mx=8+SA.l,my=H-160-SA.b,mw=Math.min(220,W*.55);panel(ui,mx-4,my-4,mw+8,156);
  mkList([{t:'Attack',fn:()=>pickTarget(bt.enemies,t=>queue({k:'atk',m,t}))},{t:'Special (8 MP)',off:m.mp<8,fn:()=>queue({k:'spc',m})},{t:'Item',fn:itemMenu},{t:'Back',fn:backCmd}],mx,my,mw,{back:backCmd})}
function itemMenu(){clearUI();const m=bt.party[bt.qi],mx=8+SA.l,my=H-160-SA.b,mw=Math.min(220,W*.55);panel(ui,mx-4,my-4,mw+8,156);
  mkList([{t:'Potion x'+inv.potion,off:inv.potion<1,fn:()=>pickTarget(bt.party,t=>queue({k:'item',it:'potion',m,t}))},{t:'Revive x'+inv.revive,off:inv.revive<1,fn:()=>pickTarget(bt.party,t=>queue({k:'item',it:'revive',m,t}))},{t:'Back',fn:cmdMenu}],mx,my,mw,{back:cmdMenu})}
function pickTarget(arr,cb){clearUI();const cand=arr===bt.party?arr:alive(arr);setMsg('Choose a target');
  const cur=new PIXI.Graphics().poly([-10,-14,10,-14,0,0]).fill(0xffe27a).stroke({width:2,color:0x222222});ui.addChild(cur);

function queue(c){bt.cmds[bt.qi]=c;nextCmd()}

function backCmd(){let i=bt.qi-1;while(i>=0&&bt.party[i].hp<=0)i--;if(i<0){sfx('error');return}bt.qi=i;cmdMenu()}
function popup(x,y,s,col){const t=bat.pops[bat.pi++%bat.pops.length];t.text=s;t.style.fill=col;t.visible=true;t.alpha=1;t.position.set(x,y);
  if(S.reduce){t.scale.set(1);tw(t,{alpha:0},1000)}else{t.scale.set(.3);tw(t.scale,{x:1.2,y:1.2},180,easeOut);tw(t,{y:y-50},800);delay(500).then(()=>tw(t,{alpha:0},300))}}
async function hurt(c,dmg,crit){c.hp=Math.max(0,c.hp-dmg);sfx(crit?'crit':'hit');popup(c.bx,c.by-c.h,String(dmg),crit?0xffd040:0xffffff);drawBar(c);
  if(S.reduce){c.cont.alpha=.55;await delay(220);c.cont.alpha=c.hp>0?1:c.isP?.35:c.cont.alpha}
  else{c.fig.tint=0xff4040;c.cont.x=c.bx+8;await delay(60);c.cont.x=c.bx-8;await delay(60);c.cont.x=c.bx;c.fig.tint=0xffffff}}
async function lunge(a,t,fn){if(!S.reduce){await tw(a.cont,{x:a.bx+(t.bx-a.bx)*.7,y:a.by+(t.by-a.by)*.7},170,easeOut)}else await delay(100);await fn();
  if(!S.reduce)await tw(a.cont,{x:a.bx,y:a.by},170);else await delay(100)}
async function kill(c){if(c.isP){c.cont.alpha=.35;return}if(bt.boss)await explosion(c);else{sfx('whoosh');await tw(c.cont,{alpha:0},350)}}
async function doCmd(c){const b=bt,m=c.m;
  if(c.k==='atk'){const t=c.t.hp>0?c.t:alive(b.enemies)[0];if(!t)return;sfx('slash');
    await lunge(m,t,async()=>{const crit=rnd()<.12;await hurt(t,Math.round(RI(14,20)*(crit?1.8:1))+m.atk,crit)});if(t.hp<=0)await kill(t)}
  else if(c.k==='spc'){m.mp-=8;drawBar(m);await cutIn(m);const ts=alive(b.enemies);sfx('special');
    await Promise.all(ts.map(t=>hurt(t,RI(20,28)+m.atk,false)));for(const t of ts)if(t.hp<=0)await kill(t)}
  else if(c.k==='item'){const t=c.t;if(inv[c.it]<1)return;
    if(c.it==='potion'){if(t.hp<=0)return;inv.potion--;sfx('heal');t.hp=Math.min(t.maxHp,t.hp+45);popup(t.bx,t.by-t.h,'+45',0x6aff8a);drawBar(t);await delay(500)}
    else{inv.revive--;await reviveFx(t);t.hp=Math.max(t.hp,Math.round(t.maxHp/2));t.cont.alpha=1;drawBar(t);popup(t.bx,t.by-t.h,'+'+t.hp,0x6aff8a);await delay(300)}}}
async function enemyAct(e){const b=bt,ts=alive(b.party);if(!ts.length||e.hp<=0)return;
  if(b.boss&&b.turn%3===2){sfx('charge');setMsg('The boss gathers power!');await delay(450);sfx('explosion');
    if(!S.reduce)anim(300,p=>{bat.x=Math.sin(p*40)*8*(1-p);if(p>=1)bat.x=0});
    for(const t of ts){hurt(t,RI(5,8),false)}await delay(700);for(const t of ts)if(t.hp<=0)await kill(t);return}
  const t=pick(ts);await lunge(e,t,async()=>{await hurt(t,b.boss?RI(7,12):RI(5,9),false)});if(t.hp<=0)await kill(t)}
async function runTurn(){const b=bt;b.busy=true;clearUI();
  for(let i=0;i<3;i++){const c=b.cmds[i];if(!c||b.party[i].hp<=0)continue;await doCmd(c);if(b!==bt)return;if(!alive(b.enemies).length)return endBattle(true)}
  setMsg('Foes attack!');
  for(const e of b.enemies){await enemyAct(e);if(b!==bt)return;if(!alive(b.party).length)return endBattle(false)}
  b.turn++;b.qi=-1;b.cmds=[];b.busy=false;nextCmd()}
function endBattle(win){bt.win=win;bt.busy=false;bt.effect=null;scene=win?'victory':'defeat';sfx(win?'win':'lose');scr=()=>endUI(win);endUI(win)}
function endUI(win){clearUI();const w=Math.min(320,W-24),x=(W-w)/2,y=H*.28;panel(ui,x,y,w,170,.92);
  centerTxt(win?'VICTORY':'DEFEAT',52,win?0xffe27a:0xff6a6a,'Bangers',y+40);centerTxt(win?'The foes are cleared.':'The party has fallen.',16,0xffffff,'Oswald',y+82);
  mkList([{t:'Continue',fn:leaveBattle}],x+20,y+110,w-40,{back:leaveBattle})}
function leaveBattle(){const b=bt;if(!b)return;anims.length=0;bat.destroy({children:true});bat=null;bt=null;fxTop=null;clearUI();app.stage.alpha=1;
  for(const m of party){m.cont=null;if(m.hp<=0)m.hp=Math.round(m.maxHp*.25);m.mp=Math.min(m.maxMp,m.mp+8)}
  if(b.patrol){b.patrol.cool=10;b.patrol.chase=false}
  if(!b.win){party.forEach((m,i)=>{m.x=480+i*6;m.y=3560});trail.length=0;path=null;patrols.forEach(p=>{p.cool=Math.max(p.cool,4)})}
  else if(b.boss){bossDone=true;bossM.visible=false;patrols.forEach(p=>p.cool=4);leader.y=Math.max(leader.y,260);showChapter(1,enterTown);return}
  else patrols.forEach(p=>{if(Math.hypot(p.x-leader.x,p.y-leader.y)<120)p.cool=Math.max(p.cool,4)});
  if(b.boss&&!b.win){leader.x=480;leader.y=3560}
  world.visible=true;enterTown()}

async function cutIn(m){const b=bt;b.effect='cutin';sfx('cutin');const c=new PIXI.Container();fxTop.addChild(c);

  fl.position.set(W/2,H*.4);c.addChild(fl);
  const y0=H*.28,ph=Math.max(110,H*.22),pn=new PIXI.Container();
  pn.addChild(new PIXI.Graphics().poly([0,y0+22,W,y0,W,y0+ph-22,0,y0+ph]).fill(0x2a3a9a).stroke({width:4,color:0xffffff}));
  const dots=new PIXI.Graphics();for(let a=0;a<14;a++)for(let r=0;r<5;r++)dots.circle(a*W/13,y0+14+r*ph/5,5).fill({color:0xffffff,alpha:.18});pn.addChild(dots);
  const s=new PIXI.Sprite(TEX.prop[m.i]);s.width=s.height=ph*.9;s.position.set(14+SA.l,y0+ph*.05);pn.addChild(s);
  const t=txt('SPECIAL!',Math.min(64,ph*.5),0xffe27a,'Bangers',{stroke:{color:0x201040,width:6}});t.anchor.set(0,.5);t.position.set(ph+14,y0+ph/2-8);pn.addChild(t);
  const t2=txt(m.name,20,0xffffff);t2.position.set(ph+16,y0+ph-34);pn.addChild(t2);c.addChild(pn);
  await anim(1500,p=>{if(S.reduce){c.alpha=p<.2?p/.2:p>.8?(1-p)/.2:1;return}
    pn.x=-(1-easeOut(Math.min(1,p/.2)))*W;fl.rotation=p*.9;c.alpha=p>.85?(1-p)/.15:1;fl.alpha=.6+.4*Math.sin(p*6)});
  c.destroy({children:true});b.effect=null}
// winged revive light: two wings of 16 feather paths, light column, turning sunburst, rings
async function reviveFx(t){const b=bt;if(!b)return;b.effect='revive';sfx('revive');const c=new PIXI.Container();c.position.set(t.bx,t.by);fxTop.addChild(c);
  const col=new PIXI.Graphics();for(let k=0;k<4;k++)col.rect(-34+k*7,-H,68-k*14,H+30).fill({color:0xfff2b0,alpha:.2});col.blendMode='add';
  const sun=new PIXI.Graphics(),Rr=Math.max(W,H)*.5;for(let i=0;i<24;i++){const a=i/24*6.283;sun.poly([0,0,Math.cos(a-.08)*Rr,Math.sin(a-.08)*Rr,Math.cos(a+.08)*Rr,Math.sin(a+.08)*Rr]).fill({color:0xffffff,alpha:.22})}
  sun.position.y=-t.h*.6;sun.blendMode='add';
  const rings=[0,1,2].map(()=>{const g=new PIXI.Graphics().circle(0,0,60).stroke({width:4,color:0xfff2b0});g.position.y=-t.h*.5;return g});
  const fe=[];for(const side of[-1,1])for(let i=0;i<16;i++){const g=new PIXI.Graphics().moveTo(0,0).quadraticCurveTo(14,-34,0,-80).quadraticCurveTo(-14,-34,0,0).fill({color:0xffffff,alpha:.92}).stroke({width:2,color:0xe8c860});
    g.position.set(side*10,-t.h*.6);g.base=side*(.35+i*.085);g.rotation=g.base;g.scale.set((1.3-i*.03)*t.u/1.7);c.addChild(g);fe.push([g,i])}
  c.addChildAt(sun,0);c.addChildAt(col,1);rings.forEach(r=>c.addChild(r));
  await anim(2400,p=>{const fade=Math.min(1,p/.2,(1-p)/.2);c.alpha=Math.max(0,fade);col.scale.x=S.reduce?1:.6+.4*Math.sin(p*3);if(!S.reduce)sun.rotation=p*3;
    rings.forEach((r,i)=>{const q=clamp(p*1.5-i*.2,0,1);r.scale.set(.3+q*2.2);r.alpha=1-q});
    for(const[g,i]of fe)if(!S.reduce)g.rotation=g.base+Math.sin(p*9+i*.3)*.06*(g.base<0?-1:1)*-1});
  c.destroy({children:true});b.effect=null}
// boss explosion: white flash + ~80 overlapping translucent puffs drifting up (only transforms, tint, alpha change per frame)
async function explosion(boss){const b=bt;b.effect='explosion';sfx('explosion');
  const fl=new PIXI.Graphics().rect(0,0,W,H).fill(0xffffff);fl.alpha=0;fxTop.addChild(fl);
  const pc=new PIXI.Container(),pf2=[];for(let i=0;i<80;i++){const g=new PIXI.Graphics().circle(0,0,34).fill(0xffffff);g.alpha=0;g.d=R(0,.5);g.vx=R(-70,70)*boss.u/3.6;g.vy=-R(25,110)*boss.u/3.6;g.s=R(.7,1.6);pc.addChild(g);pf2.push(g)}fxTop.addChild(pc);
  const ox=boss.bx,oy=boss.by-boss.h*.4;let gone=false;
  await anim(3200,p=>{const sec=p*3.2;
    fl.alpha=S.reduce?(p<.2?p/.2*.6:Math.max(0,.6-(p-.2)*1.2)):(p<.05?p/.05:Math.max(0,1-(p-.05)/.12));
    if(!gone&&p>.06){gone=true;boss.cont.visible=false}
    for(const g of pf2){const t=Math.max(0,sec-g.d);g.position.set(ox+g.vx*t,oy+g.vy*t);g.scale.set((.4+t*.8)*g.s);g.alpha=t<=0?0:.8*Math.max(0,1-t/2.5);
      const q=Math.min(1,t/2.2),r=Math.round(255+(90-255)*q),gr=Math.round(170+(90-170)*q),bl=Math.round(60+(100-60)*q);g.tint=(r<<16)|(gr<<8)|bl}});
  pc.destroy({children:true});fl.destroy();b.effect=null}

/* ===== Input ===== */
const keys={},ptr={down:false,x:0,y:0,sx:0,sy:0,t0:0,consumed:false};
const KM={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',Enter:'ok',' ':'ok',Escape:'back'};
function nav(k){if(scene==='loading')return;
  if(list){if(k==='up'||(list.h&&k==='left'))list.move(-1);else if(k==='down'||(list.h&&k==='right'))list.move(1);
    else if(k==='left'||k==='right'){const it=list.items[list.sel];if(it.adj)it.adj(k==='left'?-1:1)}else if(k==='ok')list.ok();else if(k==='back'&&list.back){sfx('back');list.back()}return}
  if(scene==='town'){if(k==='ok')interact();else if(k==='back')openMenu()}
  else if(scene==='dialogue'){if(k==='ok')dlgAdvance()}
  else if(scene==='chapter'||scene==='victory'||scene==='defeat'){if(k==='ok'||k==='back')tapScene()}}
addEventListener('keydown',e=>{unlock();const k=KM[e.key];if(!k)return;e.preventDefault();if(e.repeat&&(k==='ok'||k==='back'))return;keys[k]=true;nav(k)});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false});
const cv=app.canvas;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();Object.assign(ptr,{down:true,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t0:performance.now(),consumed:false});
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(e.clientX>=h.x&&e.clientX<=h.x+h.w&&e.clientY>=h.y&&e.clientY<=h.y+h.h){ptr.consumed=true;h.fn();return}}
  if(scene==='dialogue'){ptr.consumed=true;dlgAdvance()}else if(scene==='chapter'||scene==='victory'||scene==='defeat'){ptr.consumed=true;tapScene()}});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY});
cv.addEventListener('pointerup',()=>{if(ptr.down&&!ptr.consumed&&scene==='town'&&performance.now()-ptr.t0<300&&Math.hypot(ptr.x-ptr.sx,ptr.y-ptr.sy)<14)tapMap(ptr.x,ptr.y);ptr.down=false});
cv.addEventListener('pointercancel',()=>{ptr.down=false});
// A mouse can lift outside the canvas. Canvas handlers run first, so ordinary taps still choose their destination.
for(const ev of['pointerup','pointercancel'])addEventListener(ev,()=>{ptr.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// Browsers allow sound only from a gesture: a finger lifting (pointerup, touchend), a click or a key, not a finger touching down.
for(const ev of['pointerup','touchend','click'])addEventListener(ev,unlock,{passive:true});

/* ===== Main loop: redraws every frame at the display's rate ===== */
app.ticker.add(tk=>{frameStat(performance.now());const dt=Math.min(.05,tk.deltaMS/1000);
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt*1000;const p=Math.min(1,a.t/a.ms);a.fn(p);if(p>=1){anims.splice(i,1);a.res()}}
  if(world.visible)updWorld(dt);
  if(scene==='dialogue')tickDlg(dt)});

showTitle();
})();
</script>
